<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Salarium — isometric salt crystal -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22252b"/>
      <stop offset="1" stop-color="#121316"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

    <!-- cube: cx=512 cy=524, half-width 274.4, diamond half-height 142.7, edge 307.2 -->
    <!-- left face -->
    <polygon points="237.6,370.4 512,513.1 512,820.3 237.6,677.6" fill="#0a6ed2"/>
    <!-- right face -->
    <polygon points="786.4,370.4 512,513.1 512,820.3 786.4,677.6" fill="#0a84ff"/>
    <!-- top face -->
    <polygon points="512,227.7 786.4,370.4 512,513.1 237.6,370.4" fill="#6db6ff"/>
    <!-- lit top edges -->
    <path d="M512,227.7 L786.4,370.4 M512,227.7 L237.6,370.4"
          stroke="#add6ff" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>
</svg>
