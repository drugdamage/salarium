<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salarium</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ══════════════ THEME ══════════════ */
:root{
  color-scheme:light;
  --bg:#f5f5f7; --sidebar:#ececef; --card:#ffffff; --elev:#ffffff;
  --fill:#efeff2; --fill-hover:#e5e5e9; --seg-on:#ffffff;
  --line:rgba(0,0,0,.07); --line-strong:rgba(0,0,0,.12);
  --text:#1d1d1f; --text2:#6e6e73; --text3:#a1a1a6;
  --accent:#007aff; --accent-hover:#0a6fe6; --accent-text:#0066d6; --accent-soft:rgba(0,122,255,.10); --accent-soft2:rgba(0,122,255,.17);
  --green:#34c759; --green-text:#248a3d; --green-soft:rgba(52,199,89,.13);
  --red:#ff3b30; --red-text:#d70015; --red-soft:rgba(255,59,48,.10);
  --amber:#ff9500; --amber-text:#b25000; --amber-soft:rgba(255,149,0,.13);
  --purple:#af52de; --purple-soft:rgba(175,82,222,.12);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 10px rgba(0,0,0,.035);
  --shadow-pop:0 14px 44px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.08);
  --backdrop:rgba(20,20,25,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141416; --sidebar:#1a1a1d; --card:#1e1e21; --elev:#252528;
    --fill:#2a2a2e; --fill-hover:#333338; --seg-on:#45454b;
    --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.12);
    --text:#f5f5f7; --text2:#a1a1a6; --text3:#6e6e73;
    --accent:#0a84ff; --accent-hover:#3d9bff; --accent-text:#4da3ff; --accent-soft:rgba(10,132,255,.15); --accent-soft2:rgba(10,132,255,.24);
    --green:#30d158; --green-text:#30d158; --green-soft:rgba(48,209,88,.14);
    --red:#ff453a; --red-text:#ff6961; --red-soft:rgba(255,69,58,.14);
    --amber:#ff9f0a; --amber-text:#ffb340; --amber-soft:rgba(255,159,10,.15);
    --purple:#bf5af2; --purple-soft:rgba(191,90,242,.16);
    --shadow:none;
    --shadow-pop:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07);
    --backdrop:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141416; --sidebar:#1a1a1d; --card:#1e1e21; --elev:#252528;
  --fill:#2a2a2e; --fill-hover:#333338; --seg-on:#45454b;
  --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.12);
  --text:#f5f5f7; --text2:#a1a1a6; --text3:#6e6e73;
  --accent:#0a84ff; --accent-hover:#3d9bff; --accent-text:#4da3ff; --accent-soft:rgba(10,132,255,.15); --accent-soft2:rgba(10,132,255,.24);
  --green:#30d158; --green-text:#30d158; --green-soft:rgba(48,209,88,.14);
  --red:#ff453a; --red-text:#ff6961; --red-soft:rgba(255,69,58,.14);
  --amber:#ff9f0a; --amber-text:#ffb340; --amber-soft:rgba(255,159,10,.15);
  --purple:#bf5af2; --purple-soft:rgba(191,90,242,.16);
  --shadow:none;
  --shadow-pop:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07);
  --backdrop:rgba(0,0,0,.5);
}

html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
:lang(zh) body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI Variable Text","Segoe UI","Microsoft YaHei",system-ui,sans-serif;}
:lang(ja) body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI Variable Text","Segoe UI","Yu Gothic UI","Meiryo",system-ui,sans-serif;}
body{overflow:hidden;user-select:none;}
input{user-select:text;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
a{color:var(--accent-text);text-decoration:none;}
a:hover{text-decoration:underline;}
svg{display:block;}
:focus{outline:none;}
::selection{background:var(--accent-soft2);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
*{scrollbar-width:thin;scrollbar-color:var(--fill-hover) transparent;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--fill-hover);border-radius:5px;border:2px solid transparent;background-clip:padding-box;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.num{font-variant-numeric:tabular-nums;}

/* ══════════════ SHELL ══════════════ */
.app{display:flex;height:100vh;}
.sidebar{width:212px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 14px;}
.mac .sidebar{padding-top:56px;-webkit-app-region:drag;}
.mac .sidebar button{-webkit-app-region:no-drag;}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;}
.brand-icon{width:28px;height:28px;border-radius:7px;overflow:hidden;box-shadow:0 0 0 1px var(--line-strong),0 1px 2px rgba(0,0,0,.2);flex-shrink:0;}
.brand-name{font-size:15px;font-weight:700;letter-spacing:-.2px;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav-item{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--text);text-align:left;transition:background .12s;}
.nav-item svg{width:18px;height:18px;color:var(--text2);flex-shrink:0;}
.nav-item:hover{background:var(--fill);}
.nav-item.on{background:var(--accent-soft2);color:var(--accent-text);}
.nav-item.on svg{color:var(--accent-text);}
.sidebar-spacer{flex:1;}
.sync{display:flex;align-items:center;gap:7px;padding:0 10px;font-size:11.5px;color:var(--text3);min-height:18px;}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;}
.sync.saving i{background:var(--amber);}
.sync.err i{background:var(--red);}
.sync.err{color:var(--red-text);}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:64px;flex-shrink:0;padding:0 32px;}
.topbar-inner{height:100%;max-width:1060px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.mac .topbar{-webkit-app-region:drag;}
.mac .topbar button{-webkit-app-region:no-drag;}
.title{font-size:22px;font-weight:700;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.title span{color:var(--text3);font-weight:600;}
.title-btn{display:inline-flex;align-items:center;gap:6px;min-width:0;padding:3px 8px;margin-left:-8px;border-radius:9px;transition:background .12s;}
.title-btn:hover{background:var(--fill);}
.title-btn .chev{display:inline-flex;width:16px;height:16px;color:var(--text3);}
.title-btn .chev svg{width:16px;height:16px;}
.mp{min-width:0;width:252px;padding:8px;}
.mp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.mp-head b{font-size:14px;font-weight:650;}
.mp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.mp-grid button{height:34px;border-radius:8px;font-size:13px;font-weight:550;}
.mp-grid button:hover{background:var(--fill);}
.mp-grid button.now{color:var(--accent-text);box-shadow:inset 0 0 0 1.5px var(--accent);}
.mp-grid button.sel{background:var(--accent);color:#fff;box-shadow:none;}
.mp-now{display:block;margin:8px auto 2px;}
.month-nav{display:flex;align-items:center;gap:6px;}
.content{flex:1;overflow-y:auto;padding:4px 32px 40px;}
.page{max-width:1060px;margin:0 auto;}
.page.narrow{max-width:640px;}

/* ══════════════ PRIMITIVES ══════════════ */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;}
.card-title{font-size:14px;font-weight:650;letter-spacing:-.1px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.muted{color:var(--text2);}
.small{font-size:12.5px;line-height:1.45;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 15px;border-radius:9px;font-size:13.5px;font-weight:550;white-space:nowrap;transition:background .12s,opacity .12s;}
.btn-sm{height:28px;padding:0 11px;font-size:12.5px;border-radius:8px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-hover);}
.btn-secondary{background:var(--fill);color:var(--text);}
.btn-secondary:hover{background:var(--fill-hover);}
.btn-danger{background:var(--red);color:#fff;}
.btn-link{color:var(--accent-text);font-weight:550;font-size:12.5px;padding:0;height:auto;}
.btn-link:hover{text-decoration:underline;}
.icon-btn{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--text2);transition:background .12s,color .12s;}
.icon-btn:hover{background:var(--fill);color:var(--text);}
.icon-btn svg{width:18px;height:18px;}
.input{width:100%;height:36px;background:var(--fill);border:1px solid transparent;border-radius:9px;padding:0 11px;font:inherit;font-size:14px;color:var(--text);transition:border-color .12s,box-shadow .12s,background .12s;}
.input::placeholder{color:var(--text3);}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--card);}
.input:disabled{opacity:.5;}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;}
.field>span{font-size:12px;font-weight:550;color:var(--text2);}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.affix{position:relative;}
.affix .input{padding-right:52px;text-align:right;}
.affix em{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12.5px;color:var(--text3);pointer-events:none;}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;}
.seg button{flex:1;min-width:0;height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:550;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .12s,color .12s;}
.seg button:hover{color:var(--text);}
.seg button.on{background:var(--seg-on);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);}
.switch{width:40px;height:24px;border-radius:12px;background:var(--fill-hover);position:relative;flex-shrink:0;transition:background .18s;}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s;}
.switch.on{background:var(--green);}
.switch.on::after{transform:translateX(16px);}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;background:var(--fill);color:var(--text2);font-size:11.5px;font-weight:600;white-space:nowrap;}
.chip svg{width:13px;height:13px;}
.chip.soon{background:var(--amber-soft);color:var(--amber-text);}
.chip.done{background:var(--green-soft);color:var(--green-text);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}

/* ══════════════ WORK ══════════════ */
.summary{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:14px;}
.summary.n1{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);}
.po-list{max-height:330px;overflow-y:auto;margin:-6px -4px -4px;}
.po-row{display:flex;align-items:center;gap:10px;padding:8px 4px;}
.po-row+.po-row{border-top:1px solid var(--line);}
.po-main{flex:1;min-width:0;}
.po-range{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.po-meta{font-size:11.5px;color:var(--text2);margin-top:1px;}
.po-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.po-right b{font-size:13.5px;font-weight:650;}
.po-right b.zero{color:var(--text3);}
.po-when{font-size:11.5px;color:var(--text2);white-space:nowrap;}
.po-when.soon{color:var(--amber-text);}
.po-when.done{color:var(--green-text);}
.count{font-size:12px;font-weight:600;color:var(--text2);background:var(--fill);border-radius:999px;padding:1px 8px;}
.hero{position:relative;overflow:hidden;border-radius:16px;padding:20px 22px;color:#fff;background:linear-gradient(135deg,#1b8cff 0%,#0a6ce0 55%,#0757c2 100%);box-shadow:0 6px 24px rgba(10,108,224,.25);}
.hero-art{position:absolute;right:-26px;top:-18px;width:150px;opacity:.16;pointer-events:none;}
.hero-label{font-size:12.5px;font-weight:600;opacity:.85;}
.hero-amount{font-size:34px;font-weight:750;letter-spacing:-1px;margin:4px 0 2px;}
.hero-sub{font-size:12.5px;opacity:.85;}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden;margin:16px 0 7px;}
.bar span{display:block;height:100%;border-radius:3px;background:#fff;}
.hero-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:550;opacity:.92;}
.hero-empty{margin-top:16px;font-size:12.5px;opacity:.85;}
.payout{display:flex;flex-direction:column;}
.payout-head{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--text2);}
.payout-amount{font-size:24px;font-weight:700;letter-spacing:-.6px;margin:8px 0 2px;}
.payout-amount.zero{color:var(--text3);}
.payout-meta{font-size:12px;color:var(--text2);flex:1;}
.payout .chip{align-self:flex-start;margin-top:12px;}

.work-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start;}
.side{display:grid;gap:14px;}
.lockbar{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 12px;margin:-4px 0 14px;border-radius:10px;background:var(--fill);font-size:12.5px;font-weight:550;color:var(--text2);}
.lockbar svg{width:15px;height:15px;flex-shrink:0;}
.lockbar.open{background:var(--amber-soft);color:var(--amber-text);}
.lockbar .btn{margin-left:auto;background:var(--card);box-shadow:0 0 0 .5px var(--line-strong);}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;}
.cal-head div{text-align:center;font-size:11px;font-weight:650;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;}
.cal-head div.sun{color:var(--red-text);opacity:.75;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.day{position:relative;height:64px;border-radius:11px;padding:7px 8px 7px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:background .12s,box-shadow .12s;}
.day:hover{background:var(--fill);}
.day.ro{cursor:default;}
.day.ro:hover{background:transparent;}
.day.empty{visibility:hidden;}
.day .n{width:24px;height:24px;margin:-3px 0 0 -3px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:550;}
.day.sun .n{color:var(--red-text);}
.day.today .n{background:var(--accent);color:#fff;font-weight:700;}
.day.worked{background:var(--accent-soft);}
.day.worked:hover{background:var(--accent-soft2);}
.day.hol{background:var(--red-soft);}
.day.ro.worked:hover{background:var(--accent-soft);}
.day.ro.hol:hover{background:var(--red-soft);}
.day .h{font-size:12px;font-weight:650;color:var(--accent-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.day .h.off{color:var(--red-text);}
.day .h.sh{color:var(--amber-text);}
.day .mks{position:absolute;top:9px;right:9px;display:flex;gap:3px;}
.day .mks i{width:7px;height:7px;border-radius:50%;}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--text2);}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend .hint{margin-left:auto;color:var(--text3);}
.goal-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text2);line-height:1.6;}
.goal-foot b{color:var(--green-text);font-weight:650;}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;font-size:13px;}
.stat+.stat{border-top:1px solid var(--line);}
.stat span{color:var(--text2);}
.stat b{font-weight:600;}

/* ══════════════ PLANNER ══════════════ */
.pl-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start;}
.patterns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;}
.pattern{padding:11px 12px;border-radius:12px;background:var(--fill);text-align:left;border:1.5px solid transparent;transition:background .12s,border-color .12s;min-width:0;}
.pattern:hover{background:var(--fill-hover);}
.pattern b{display:block;font-size:15px;font-weight:700;letter-spacing:-.2px;}
.pattern small{display:block;font-size:11.5px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pattern.on{background:var(--accent-soft);border-color:var(--accent);}
.pattern.on b{color:var(--accent-text);}
.pl-stats{display:flex;gap:28px;margin-bottom:16px;}
.pl-stats div{font-size:12px;color:var(--text2);font-weight:550;}
.pl-stats b{display:block;font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.4px;}
.cal.compact .day{height:42px;padding:0;align-items:center;justify-content:center;cursor:default;}
.cal.compact .day:hover{background:transparent;}
.cal.compact .day .n{margin:0;}
.cal.compact .day.sug{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent);}
.cal.compact .day.sug .n{color:var(--accent-text);}
.cal.compact .day.today .n{color:#fff;}
.cal.compact .day.hol{background:var(--red-soft);}
.cal.compact .day .sd{position:absolute;top:7px;right:8px;width:5px;height:5px;border-radius:50%;background:var(--amber);}
.cal.compact .day .wd{position:absolute;bottom:5px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--accent);}
.pl-note{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:12px;color:var(--text2);line-height:1.45;}
.pl-note .sw{width:12px;height:12px;border-radius:3px;background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent);flex-shrink:0;margin-top:1px;}
.hours-row{display:grid;grid-template-columns:1fr 10px 1fr;align-items:center;gap:6px 8px;}
.hours-row+.hours-row{margin-top:14px;}
.hours-row>span{grid-column:1/-1;font-size:12px;font-weight:550;color:var(--text2);}
.hours-row i{text-align:center;color:var(--text3);font-style:normal;}
.hours-row .input{padding:0 8px 0 10px;min-width:0;}
.hours-row .input::-webkit-calendar-picker-indicator{opacity:.5;cursor:pointer;}
.bp{display:flex;flex-direction:column;gap:4px;margin-top:14px;}
.bp-row{display:flex;align-items:center;justify-content:space-between;gap:10px;height:32px;padding:0 10px 0 12px;border-radius:8px;background:var(--fill);font-size:12.5px;position:relative;}
.bp-row::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--accent);}
.bp-row.brk{background:var(--green-soft);}
.bp-row.brk::before{background:var(--green);}
.bp-row b{font-weight:600;}
.bp-row span{color:var(--text2);font-size:12px;}
.bp-row.brk span{color:var(--green-text);font-weight:600;}
.empty-box{text-align:center;padding:30px 16px;}
.empty-box p{font-size:13px;color:var(--text2);line-height:1.5;margin:0 auto 14px;max-width:340px;}

/* ══════════════ SETTINGS ══════════════ */
.group-title{font-size:12px;font-weight:650;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin:26px 6px 8px;}
.group-title:first-child{margin-top:4px;}
.group{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:56px;}
.row+.row{border-top:1px solid var(--line);}
.row-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.row-icon svg{width:17px;height:17px;}
.row-text{flex:1;min-width:0;}

<script>
/* Supabase credentials live in config.js (gitignored) — see config.example.js */
const CFG = window.SALARIUM_CONFIG || {};
const SUPABASE_URL = String(CFG.SUPABASE_URL || '').replace(/\/+$/, '');
const SUPABASE_KEY = String(CFG.SUPABASE_KEY || '');
const CONFIG_OK = /^https?:\/\/.+/.test(SUPABASE_URL) && SUPABASE_KEY.length > 0 &&
  !/YOUR-/.test(SUPABASE_URL + SUPABASE_KEY);
const NATIVE = window.native || null;
const APP_INFO = (NATIVE && NATIVE.info) || { version: '', platform: '' };
if (APP_INFO.platform === 'darwin') document.documentElement.classList.add('mac');

/* ══════════════ STORAGE ══════════════ */
const NET_TIMEOUT = 12000;
async function fetchTO(url, opts, ms){
  const ctrl = new AbortController();
  const tm = setTimeout(()=>ctrl.abort(), ms||NET_TIMEOUT);
  try { return await fetch(url, Object.assign({}, opts, {signal: ctrl.signal})); }
  finally { clearTimeout(tm); }
}
/* Strict read: throws on network failure. Returns null ONLY when the request
   succeeded and the row genuinely does not exist. */
async function sGetStrict(k){
  let lastErr;
  for (let attempt=0; attempt<3; attempt++){
    try{
      const res = await fetchTO(SUPABASE_URL+'/rest/v1/kv_store?key=eq.'+encodeURIComponent(k)+'&select=value', {
        headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY }
      });
      if(!res.ok) throw new Error('HTTP '+res.status+' — '+k);
      const arr = await res.json();
      return (Array.isArray(arr) && arr[0]) ? arr[0].value : null;
    } catch(e){
      lastErr = e;
      if (attempt<2) await new Promise(r=>setTimeout(r, 700*(attempt+1)));
    }
  }
  throw lastErr || new Error('Read failed: '+k);
}
/* Throws when the write didn't reach the database. */
async function sSet(k, v, keepalive){
  const res = await fetchTO(SUPABASE_URL+'/rest/v1/kv_store?on_conflict=key', {
    method:'POST', keepalive:!!keepalive,
    headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates' },
    body: JSON.stringify({ key:k, value:v })
  });
  if (!res.ok) throw new Error('HTTP '+res.status+' — '+k);
}

/* ══════════════ STATE ══════════════ */
let TAB = 'work';
const now0 = new Date();
let Y = now0.getFullYear(), Mo = now0.getMonth();
let LOAD = CONFIG_OK ? 'loading' : 'config', LOAD_ERR = '';
let RATE = 220, TAX = 0.87, CUR = 'RUB', PAY = null; /* set from payDays on load */
let workData = {}, workSettings = {}, holidayAdj = {}, overtimeRate = {};
let scheduleHours = {weekdayFrom:'06:00', weekdayTo:'21:00', weekendFrom:'09:00', weekendTo:'18:00'}, dayHours = {};
let workEditUnlocked = {}, breakDay = 'weekday';
let dayDraft = null, confirmState = null, ddOpen = null;

/* Everything that is stored in Supabase, by key. */
const PERSIST = {
  payRate:()=>RATE, payTax:()=>TAX, workData:()=>workData, workSettings:()=>workSettings,
  holidayAdj:()=>holidayAdj, scheduleHours:()=>scheduleHours, dayHours:()=>dayHours,
  overtimeRate:()=>overtimeRate, lang:()=>LANG, currency:()=>CUR, payDays:()=>PAY,
};
const KEYS = Object.keys(PERSIST);

/* ══════════════ SAVING ══════════════ */
const saveTimers = {}, failedKeys = new Set();
let inFlight = 0, lastErrToast = 0;
function save(key){ clearTimeout(saveTimers[key]); delete saveTimers[key]; push(key); }
function saveLater(key, ms){
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(()=>{ delete saveTimers[key]; push(key); }, ms||500);
  syncUI();
}
async function push(key, keepalive){
  inFlight++; syncUI();
  try {
    await sSet(key, PERSIST[key](), keepalive);
    failedKeys.delete(key);
  } catch(e){
    failedKeys.add(key);
    if (Date.now()-lastErrToast > 15000){ lastErrToast = Date.now(); toast(t('toast_save_err'), 'err'); }
    if (!keepalive) saveTimers[key] = setTimeout(()=>{ delete saveTimers[key]; push(key); }, 5000);
  } finally { inFlight--; syncUI(); }
}
function syncUI(){
  const el = document.getElementById('sync'); if (!el) return;
  const st = failedKeys.size ? 'err' : (inFlight || Object.keys(saveTimers).length) ? 'saving' : 'ok';
  el.className = 'sync '+st;
  el.innerHTML = '<i></i>'+t(st==='err'?'sync_err':st==='saving'?'sync_saving':'sync_ok');
}
window.addEventListener('beforeunload', ()=>{
  Object.keys(saveTimers).forEach(k=>{ clearTimeout(saveTimers[k]); delete saveTimers[k]; push(k, true); });
});

/* ══════════════ I18N ══════════════ */
function detectLang(){
  try { const sv = localStorage.getItem('lang'); if (I18N[sv]) return sv; } catch(e){}
  const nav = String(navigator.language||'').slice(0,2).toLowerCase();
  return I18N[nav] ? nav : 'en';
}
let LANG = detectLang();
document.documentElement.lang = LANG;

function t(k){
  const dict = I18N[LANG] || I18N.en;
  let s = (dict[k]!==undefined) ? dict[k] : (I18N.en[k]!==undefined ? I18N.en[k] : k);
  for (let i=1; i<arguments.length; i++) s = s.split('{'+(i-1)+'}').join(arguments[i]);
  return s;
}
function LOC(){ const l = LANGS.find(x=>x.code===LANG); return l ? l.locale : 'en-GB'; }
function cap(s){ return s ? s.charAt(0).toLocaleUpperCase(LOC())+s.slice(1) : s; }
const fmtCache = {};
function fmt(kind, opts){
  const id = LANG+'|'+CUR+'|'+kind;
  if (!fmtCache[id]){
    fmtCache[id] = kind.startsWith('n:') ? new Intl.NumberFormat(LOC(), opts)
                 : kind.startsWith('r:') ? new Intl.RelativeTimeFormat(LOC(), opts)
                 : new Intl.DateTimeFormat(LOC(), opts);
  }
  return fmtCache[id];
}
function money(n){ return fmt('n:money',{style:'currency',currency:CUR,currencyDisplay:'narrowSymbol',maximumFractionDigits:0,minimumFractionDigits:0}).format(Math.round(n)); }
function moneyExact(n){ return fmt('n:money2',{style:'currency',currency:CUR,currencyDisplay:'narrowSymbol',maximumFractionDigits:2,minimumFractionDigits:0}).format(n); }
function curSymbol(code){
  try {
    const p = new Intl.NumberFormat(LOC(),{style:'currency',currency:code||CUR,currencyDisplay:'narrowSymbol'}).formatToParts(1).find(x=>x.type==='currency');
    return p ? p.value : code;
  } catch(e){ return code; }
}
function perHour(){ return curSymbol()+'/'+t('h_unit'); }
function monthTitle(mo, y){ return /^(zh|ja)/.test(LANG) ? '<span>'+y+'年</span> '+monthName(mo) : monthName(mo)+' <span>'+y+'</span>'; }
function monthName(mo){ return LANG==='zh' ? (mo+1)+'月' : cap(fmt('d:month',{month:'long'}).format(new Date(2024,mo,1))); }
function dayNames(){ return [1,2,3,4,5,6,7].map(d=>cap(fmt('d:wd',{weekday:'short'}).format(new Date(2024,0,d)).replace('.',''))); }
function shortDate(date){ return fmt('d:short',{day:'numeric',month:'short'}).format(date); }
function longDate(date){ return cap(fmt('d:long',{weekday:'long',day:'numeric',month:'long'}).format(date)); }
function periodLabel(from,to){ return fmt('d:range',{day:'numeric',month:'long'}).formatRange(from, to); }
function periodShort(from,to){ return fmt('d:rangeS',{day:'numeric',month:'short'}).formatRange(from, to); }
function relDays(n){ return fmt('r:day',{numeric:'auto'}).format(n,'day'); }
function hrsFmt(h){
  const hh=Math.floor(Math.abs(h)), mm=Math.round((Math.abs(h)-hh)*60), sp=t('u_sep');
  if(!hh&&!mm) return '0'+sp+t('m_unit');
  return hh ? (hh+sp+t('h_unit')+(mm?' '+mm+sp+t('m_unit'):'')) : (mm+sp+t('m_unit'));
}

function setLang(l){
  if (!I18N[l]) return;
  LANG = l;
  document.documentElement.lang = l;
  try { localStorage.setItem('lang', l); } catch(e){}
  if (LOAD==='ok') save('lang');
  render();
}

/* ══════════════ THEME ══════════════ */
let THEME = 'system';
try { const th = localStorage.getItem('theme'); if (['system','light','dark'].includes(th)) THEME = th; } catch(e){}
function applyTheme(){
  if (THEME==='system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', THEME);
  if (NATIVE) NATIVE.setTheme(THEME);
}
function setTheme(th){
  THEME = th;
  try { localStorage.setItem('theme', th); } catch(e){}
  applyTheme(); render();
}
applyTheme();

/* ══════════════ PAY SCHEDULE ══════════════ */
/* Two ways to get paid:
   - 'dates': the month is split into 1–31 periods by day of the month. Every
     period but the last ends on a set day; the last one runs to the end of the
     month. Each period is paid on a day of the same or the next month.
   - 'cycle': every N days counted from a start date (daily, weekly, every two
     weeks…), paid a set number of days after the period ends.
   With `shift` on (the default), a payday on a Saturday or Sunday moves to
   the Friday before. */
const PAY_LAST_END = 30, CYCLE_MAX = 60;
const PAY_COLORS = ['var(--accent)','var(--green)','var(--purple)','var(--amber)'];
const PAY_TILES = ['#0a84ff','#34c759','#af52de','#ff9500'];
/* Suggested payday for a period that ends on day `end`: nine days later. */
function payFor(end){ const day = end+9; return day<=31 ? {day, month:0} : {day:day-30, month:1}; }
function defaultPay(){
  return { mode:'dates', periods:[Object.assign({end:15}, payFor(15)), payFor(PAY_LAST_END)],
    cycle:{len:7, start:'2024-01-01', delay:5}, shift:true };
}
function cleanPeriods(ps){
  if (!Array.isArray(ps) || !ps.length || ps.length>31) return null;
  let prev = 0;
  const out = [];
  for (let i=0; i<ps.length; i++){
    const day = Number(ps[i].day), month = Number(ps[i].month)===1 ? 1 : 0;
    if (!(day>=1 && day<=31)) return null;
    const p = {day, month};
    if (i<ps.length-1){
      const end = Number(ps[i].end);
      if (!(end>prev && end<=PAY_LAST_END)) return null;
      p.end = prev = end;
    }
    out.push(p);
  }
  return out;
}
function cleanCycle(c){
  if (!c) return null;
  const len = Number(c.len), delay = Number(c.delay);
  if (!(Number.isInteger(len) && len>=1 && len<=CYCLE_MAX) || !(Number.isInteger(delay) && delay>=0 && delay<=CYCLE_MAX)) return null;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(c.start) || isNaN(parseDay(c.start))) return null;
  return {len, start:c.start, delay};
}
function cleanPay(v){
  const def = defaultPay();
  if (!v || typeof v!=='object') return def;
  if (v.first && v.second) v = {periods:[{end:15, day:v.first, month:0}, {day:v.second, month:1}]}; /* format before 2.2 */
  return { mode: v.mode==='cycle' ? 'cycle' : 'dates',
    periods: cleanPeriods(v.periods) || def.periods,
    cycle: cleanCycle(v.cycle) || def.cycle,
    shift: v.shift!==false };
}
function addDays(date, n){ return new Date(date.getFullYear(), date.getMonth(), date.getDate()+n); }
function dayDiff(a, b){ return Math.round((a-b)/86400000); }
function parseDay(str){ const [y,m,d] = str.split('-').map(Number); return new Date(y, m-1, d); }
function payDate(date){ const wd = date.getDay(); return PAY.shift && (wd===6 || wd===0) ? addDays(date, wd===6 ? -1 : -2) : date; }
/* Pay periods that overlap month y/mo, as {i, from, to, pay} dates (+ p, the period setting, in 'dates' mode). */
function payoutsFor(y, mo){
  const first = new Date(y,mo,1), d = dim(y,mo), out = [];
  if (PAY.mode==='cycle'){
    const c = PAY.cycle, a = parseDay(c.start);
    const k0 = Math.floor(dayDiff(first,a)/c.len), k1 = Math.floor(dayDiff(new Date(y,mo,d),a)/c.len);
    for (let k=k0; k<=k1; k++){
      const from = addDays(a, k*c.len), to = addDays(from, c.len-1);
      out.push({i:k-k0, from, to, pay:payDate(addDays(to, c.delay))});
    }
    return out;
  }
  let start = 1;
  PAY.periods.forEach((p,i)=>{
    const end = i===PAY.periods.length-1 ? d : Math.min(p.end, d);
    if (start<=end){
      const pm = new Date(y, mo+p.month, 1), py = pm.getFullYear(), pmo = pm.getMonth();
      out.push({i, p, from:new Date(y,mo,start), to:new Date(y,mo,end), pay:payDate(new Date(py, pmo, Math.min(p.day, dim(py,pmo))))});
    }
    start = Math.max(start, end+1);
  });
  return out;
}
/* Payouts whose payday falls in month y/mo (they can come from earlier months,
   or from the next one when a weekend payday on the 1st moves back). */
function paydaysIn(y, mo){
  const seen = {}, out = [];
  [-2,-1,0,1].forEach(off=>{
    const m = new Date(y, mo+off, 1);
    payoutsFor(m.getFullYear(), m.getMonth()).forEach(r=>{
      if (r.pay.getFullYear()!==y || r.pay.getMonth()!==mo || seen[r.from.getTime()]) return;
      seen[r.from.getTime()] = 1; out.push(r);
    });
  });
  return out;
}
/* Settings view of the 'dates' periods, by nominal day (the last one ends on the 31st). */
function dateRows(){
  let from = 1;
  return PAY.periods.map((p,i)=>{ const last = i===PAY.periods.length-1, r = {i, p, from, last, to:last ? 31 : p.end}; from = r.to+1; return r; });
}

/* ══════════════ HELPERS ══════════════ */
function mKey(y,mo){ return y+'-'+String(mo+1).padStart(2,'0'); }
function isPastMonth(y,mo){ const n=new Date(); return (y<n.getFullYear()) || (y===n.getFullYear() && mo<n.getMonth()); }
function dim(y,m){ return new Date(y,m+1,0).getDate(); }
function firstWd(y,m){ const d=new Date(y,m,1).getDay(); return d===0?6:d-1; }
function parseTime(str){ if(!str) return 0; const [h=0,m=0,s=0]=str.split(':').map(Number); return h+m/60+s/3600; }
function cellTime(str){ const [h,m]=str.split(':'); return Number(h)+':'+m; }
function daysTo(date){ const tt=new Date(), today=new Date(tt.getFullYear(),tt.getMonth(),tt.getDate()); return Math.round((date-today)/86400000); }
function keyFor(y,mo,d){ return y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function wKey(d){ return keyFor(Y,Mo,d); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function isTodayCell(n){ const d=new Date(); return n===d.getDate() && Mo===d.getMonth() && Y===d.getFullYear(); }
function holidayHourAdj(entry){
  if (!entry) return 0;
  if (entry.type==='shortened') return -(Number(entry.hours)||0);
  return 0; /* holiday: non-working marker, does not reduce the hours goal */
}
function calcRange(from, to){
  let h=0, gross=0;
  for (let dt=from; dt<=to; dt=addDays(dt,1)){
    const k = keyFor(dt.getFullYear(), dt.getMonth(), dt.getDate()), hrs = parseTime(workData[k]);
    h += hrs;
    gross += hrs*(overtimeRate[k] ? Number(overtimeRate[k]) : RATE);
  }
  return {h, gross, net:gross*TAX};
}
function computeHoursStatusFor(y,mo){
  const k = mKey(y,mo);
  const ws = workSettings[k] || {};
  const shifts=Number(ws.shifts)||0, perShift=Number(ws.hoursPerShift)||0;
  let target = shifts*perShift;
  const d = dim(y,mo);
  let actual=0;
  for(let dd=1; dd<=d; dd++){
    const dk=keyFor(y,mo,dd);
    actual += parseTime(workData[dk]);
    if (holidayAdj[dk]) target += holidayHourAdj(holidayAdj[dk]);
  }
  return {target, actual, remaining: target-actual};
}
function canEditMonth(){ return !isPastMonth(Y,Mo) || !!workEditUnlocked[mKey(Y,Mo)]; }

/* ══════════════ SCHEDULE SUGGESTION ══════════════ */
/* Short days are working days by definition, so they're always in the schedule:
   one the pattern missed takes the place of the nearest suggested day. */
function generateScheduleSuggestion(y, mo, shiftsTarget, patternType, blocked, required){
  required = required || new Set();
  const days = new Set(patternSuggestion(y, mo, shiftsTarget, patternType, blocked || new Set(), required));
  required.forEach(r=>{
    if (days.has(r)) return;
    let near = null;
    days.forEach(dd=>{ if (!required.has(dd) && (near===null || Math.abs(dd-r)<Math.abs(near-r))) near = dd; });
    if (near===null) return;
    days.delete(near); days.add(r);
  });
  return [...days].sort((a,b)=>a-b);
}
function patternSuggestion(y, mo, shiftsTarget, patternType, blocked, required){
  const d = dim(y,mo);
  shiftsTarget = Math.min(Number(shiftsTarget)||0, d);
  if (shiftsTarget<=0) return [];
  if (patternType==='flex') return flexibleScheduleSuggestion(y, mo, shiftsTarget, blocked);
  if (patternType==='7/0'){
    const days=[]; let count=0;
    for(let dd=1; dd<=d && count<shiftsTarget; dd++){ if(blocked.has(dd)) continue; days.push(dd); count++; }
    return days;
  }
  const onLen = patternType==='2/2' ? 2 : 5;
  const offLen = 2;
  const cycle = onLen+offLen;
  const buildForPhase = phase => {
    const days=[]; let count=0;
    for(let dd=1; dd<=d && count<shiftsTarget; dd++){
      if (blocked.has(dd)) continue;
      if (((dd-1+phase)%cycle) < onLen){ days.push(dd); count++; }
    }
    return days;
  };
  let best=null, bestScore=-1;
  for(let phase=0; phase<cycle; phase++){
    const days = buildForPhase(phase);
    if (days.length<shiftsTarget) continue;
    let score=0;
    required.forEach(r=>{ if (days.includes(r)) score+=100; });
    for(let dd=1; dd<=d; dd++){
      const wd=new Date(y,mo,dd).getDay();
      if ((wd===0||wd===6) && !days.includes(dd)) score++;
    }
    if (score>bestScore){ bestScore=score; best=days; }
  }
  return best || buildForPhase(0);
}
function flexibleScheduleSuggestion(y, mo, shiftsTarget, blocked){
  const d = dim(y,mo);
  const available=[]; for(let dd=1; dd<=d; dd++) if(!blocked.has(dd)) available.push(dd);
  const n = Math.min(shiftsTarget, available.length);
  if (n<=0) return [];
  const isWeekend = dd => { const wd=new Date(y,mo,dd).getDay(); return wd===0||wd===6; };
  const used=new Set(), days=[];
  for(let i=0;i<n;i++){
    let idx = Math.max(0, Math.min(available.length-1, Math.round((i+0.5)*available.length/n)));
    let candidate = available[idx];
    if (isWeekend(candidate)){
      if (idx-1>=0 && !used.has(available[idx-1]) && !isWeekend(available[idx-1])) candidate=available[idx-1];
      else if (idx+1<available.length && !used.has(available[idx+1]) && !isWeekend(available[idx+1])) candidate=available[idx+1];
    }
    let guard=0;
    while(used.has(candidate) && guard<available.length){ idx=(idx+1)%available.length; candidate=available[idx]; guard++; }
    used.add(candidate); days.push(candidate);
  }
  return days.sort((a,b)=>a-b);
}

/* ══════════════ BREAK PLAN ══════════════ */
function buildBreakPlan(shiftHours){
  /* 5-minute break roughly every hour (OSHA micro-pauses) plus one 15-minute break
     near the middle of the shift (NIOSH; Duke Health for call-centre operators).
     Short shifts get a single break at the midpoint. */
  if (!shiftHours || shiftHours<=0) return [];
  const totalMin = shiftHours*60;
  if (totalMin <= 75){
    if (totalMin <= 30) return [{type:'work', hours:shiftHours}];
    const half = totalMin/2;
    return [
      {type:'work', hours:half/60},
      {type:'break', hours:5/60},
      {type:'work', hours:(totalMin-half)/60},
    ];
  }
  const blocks=[]; let remaining=totalMin, elapsed=0, midGiven=false;
  const midPoint = totalMin/2;
  while (remaining > 0.5){
    const work = Math.min(60, remaining);
    blocks.push({type:'work', hours:work/60});
    remaining -= work; elapsed += work;
    if (remaining > 0.5){
      const isMid = !midGiven && elapsed >= midPoint;
      if (isMid) midGiven = true;
      blocks.push({type:'break', hours:(isMid?15:5)/60});
    }
  }
  return blocks;
}
function fmtClock(mins){
  mins = ((Math.round(mins)%1440)+1440)%1440;
  const h=Math.floor(mins/60), m=mins%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function breakPlanRows(startStr, shiftHours){
  if (!startStr || !shiftHours) return [];
  const [sh,sm] = startStr.split(':').map(Number);
  let cursor = sh*60+sm;
  return buildBreakPlan(shiftHours).map(b=>{
    const dur=b.hours*60;
    const row = {type:b.type, from:fmtClock(cursor), to:fmtClock(cursor+dur), mins:Math.round(dur)};
    cursor += dur;
    return row;
  });
}
function resolvedHoursForDay(y,mo,dd){
  const k=keyFor(y,mo,dd);
  if (dayHours[k] && (dayHours[k].from||dayHours[k].to)) return (dayHours[k].from||'—')+'–'+(dayHours[k].to||'—');
  const wd=new Date(y,mo,dd).getDay();
  return (wd===0||wd===6) ? scheduleHours.weekendFrom+'–'+scheduleHours.weekendTo : scheduleHours.weekdayFrom+'–'+scheduleHours.weekdayTo;
}

async function init(){
  if (!CONFIG_OK){ LOAD='config'; render(); return; }
  LOAD='loading'; render();
  let raw;
  try {
    const vals = await Promise.all(KEYS.map(k=>sGetStrict(k)));
    raw = {}; KEYS.forEach((k,i)=>{ raw[k]=vals[i]; });
  } catch(e){
    LOAD='error'; LOAD_ERR = (e && e.message) || ''; render();
    return;
  }

  if (I18N[raw.lang]){
    LANG = raw.lang;
    document.documentElement.lang = LANG;
    try { localStorage.setItem('lang', LANG); } catch(e){}
  }
  RATE = typeof raw.payRate==='number' && raw.payRate>0 ? raw.payRate : 220;
  TAX = typeof raw.payTax==='number' && raw.payTax>=0 && raw.payTax<=1 ? raw.payTax : 0.87;
  CUR = typeof raw.currency==='string' && /^[A-Z]{3}$/.test(raw.currency) ? raw.currency : 'RUB';
  PAY = cleanPay(raw.payDays);
  workData = raw.workData || {};
  workSettings = raw.workSettings || {};
  holidayAdj = raw.holidayAdj || {};
  Object.keys(holidayAdj).forEach(k=>{
    const v = holidayAdj[k];
    if (typeof v === 'number'){
      const [yy,mm] = k.split('-').map(Number);
      const ws = workSettings[yy+'-'+String(mm).padStart(2,'0')] || {};
      const perShift = Number(ws.hoursPerShift)||0;
      holidayAdj[k] = (perShift>0 && v===-perShift) ? {type:'holiday'} : {type:'shortened', hours:Math.abs(v)};
    }
  });
  scheduleHours = raw.scheduleHours || scheduleHours;
  dayHours = raw.dayHours || {};
  overtimeRate = raw.overtimeRate || {};

  LOAD='ok'; render();
}

  const hero = '<div class="hero">'+cubeArt()+

    '<div class="hero-amount num">'+money(tot.net)+'</div>'+
    '<div class="hero-sub num">'+t('before_tax', money(tot.gross))+' · '+t('worked', hrsFmt(tot.h))+'</div>'+
    progress+'</div>';

  const when = date => { const diff = daysTo(date); return diff<0 ? t('paid_on', shortDate(date)) : t('payout_in', diff<=30 ? relDays(diff) : shortDate(date)); };
  const whenCls = date => { const diff = daysTo(date); return diff<0 ? ' done' : diff<=3 ? ' soon' : ''; };
  const payout = (r, head) => {
    const p = r.calc;
    return '<div class="card payout"><div class="payout-head"><span class="dot" style="background:'+PAY_COLORS[r.i%4]+'"></span>'+(head ? head+' · ' : '')+periodLabel(r.from, r.to)+'</div>'+
      '<div class="payout-amount num'+(p.net===0?' zero':'')+'">'+money(p.net)+'</div>'+
      '<div class="payout-meta num">'+(p.h>0 ? hrsFmt(p.h)+' · '+t('before_tax', money(p.gross)) : t('no_hours'))+'</div>'+
      '<span class="chip'+whenCls(r.pay)+'">'+(daysTo(r.pay)<0 ? ICONS.check : '')+when(r.pay)+'</span></div>';
  };
  /* Up to two payouts get their own cards; with more, the next one gets a card and all of them go in a list. */
  const many = pays.length>2, next = pays.find(r=>daysTo(r.pay)>=0);
  const cards = many ? payout(next || pays[pays.length-1], t(next ? 'po_next' : 'po_last')) : pays.map(r=>payout(r)).join('');
  const payList = many ? '<div class="card"><div class="card-title">'+t('po_list')+'<span class="count num">'+pays.length+'</span></div><div class="po-list">'+
    pays.map(r=>'<div class="po-row"><span class="dot" style="background:'+PAY_COLORS[r.i%4]+'"></span>'+
      '<div class="po-main"><div class="po-range">'+periodShort(r.from, r.to)+'</div><div class="po-meta num">'+(r.calc.h>0 ? hrsFmt(r.calc.h) : t('no_hours'))+'</div></div>'+
      '<div class="po-right"><b class="num'+(r.calc.net===0?' zero':'')+'">'+money(r.calc.net)+'</b><span class="po-when'+whenCls(r.pay)+'">'+when(r.pay)+'</span></div></div>').join('')+
    '</div></div>' : '';
  const payMarks = {};
  paydaysIn(Y,Mo).forEach(r=>{ const n = r.pay.getDate(); payMarks[n] = (payMarks[n]||0) + calcRange(r.from, r.to).net; });

  /* calendar */
  const cells = [...Array(fw).fill(null), ...Array.from({length:d},(_,i)=>i+1)];
  while (cells.length%7!==0) cells.push(null);
  const head = dayNames().map((n,i)=>'<div'+(i===6?' class="sun"':'')+'>'+n+'</div>').join('');
  const grid = cells.map((n,i)=>{
    if (!n) return '<div class="day empty"></div>';
    const dk = wKey(n), time = workData[dk], adj = holidayAdj[dk], ot = overtimeRate[dk];
    const cls = ['day', isTodayCell(n)?'today':'', time?'worked':'', adj&&adj.type==='holiday'?'hol':'', i%7===6?'sun':'', canEdit?'':'ro'].filter(Boolean).join(' ');
    const pm = payMarks[n];
    const marks = (adj ? '<i style="background:'+(adj.type==='holiday'?'var(--red)':'var(--amber)')+'"></i>' : '')+(ot ? '<i style="background:var(--purple)"></i>' : '')+(pm!==undefined ? '<i style="background:var(--green)"></i>' : '');
    const tips = [time ? hrsFmt(parseTime(time)) : resolvedHoursForDay(Y,Mo,n)];
    if (adj) tips.push(adj.type==='holiday' ? t('tip_holiday') : t('tip_short', hrsFmt(Number(adj.hours)||0)));
    if (ot) tips.push(t('tip_extra', moneyExact(Number(ot))+'/'+t('h_unit')));
    if (pm!==undefined) tips.push(t('tip_payday', money(pm)));
    return '<div class="'+cls+'"'+(canEdit?' onclick="openDay('+n+')"':'')+' title="'+esc(tips.join(' · '))+'">'+
      '<span class="n">'+n+'</span>'+(marks?'<span class="mks">'+marks+'</span>':'')+
      (time ? '<span class="h num">'+cellTime(time)+'</span>'
        : adj ? (adj.type==='holiday' ? '<span class="h off">'+t('type_holiday')+'</span>' : '<span class="h sh num">−'+hrsFmt(Number(adj.hours)||0)+'</span>') : '')+'</div>';
  }).join('');
  const lockbar = isPast ? (canEdit
      ? '<div class="lockbar open">'+ICONS.unlock+t('lock_open')+'<button class="btn btn-sm btn-secondary" onclick="toggleWorkEdit()">'+t('lock')+'</button></div>'
      : '<div class="lockbar">'+ICONS.lock+t('lock_past')+'<button class="btn btn-sm btn-secondary" onclick="toggleWorkEdit()">'+t('unlock')+'</button></div>')
    : '';
  const legend = '<div class="legend">'+
    '<span><i class="dot" style="background:var(--red)"></i>'+t('lg_holiday')+'</span>'+
    '<span><i class="dot" style="background:var(--amber)"></i>'+t('lg_short')+'</span>'+
    '<span><i class="dot" style="background:var(--purple)"></i>'+t('lg_extra')+'</span>'+
    '<span><i class="dot" style="background:var(--green)"></i>'+t('lg_payday')+'</span>'+
    (canEdit ? '<span class="hint">'+t('cal_hint')+'</span>' : '')+'</div>';
  const calendar = '<div class="card">'+lockbar+'<div class="cal-head">'+head+'</div><div class="cal">'+grid+'</div>'+legend+'</div>';

  /* goal + month stats */
  const dis = canEdit ? '' : ' disabled';
  const goal = '<div class="card"><div class="card-title">'+t('goal_title')+'</div>'+
    '<div class="fields">'+
      '<label class="field"><span>'+t('f_shifts')+'</span><input class="input num" type="number" min="0" placeholder="0" value="'+esc(ws.shifts||'')+'" oninput="setWorkSetting(\'shifts\', this.value)"'+dis+'></label>'+
      '<label class="field"><span>'+t('f_hours')+'</span><input class="input num" type="number" min="0" step="0.5" placeholder="0" value="'+esc(ws.hoursPerShift||'')+'" oninput="setWorkSetting(\'hoursPerShift\', this.value)"'+dis+'></label>'+
    '</div>'+
    (hs.target>0 ? '<div class="goal-foot num">'+t('goal_total', hrsFmt(hs.target))+'<br><b>'+t('goal_full', money(hs.target*RATE*TAX))+'</b></div>' : '')+
    '</div>';
  const daysWorked = Object.keys(workData).filter(x=>x.startsWith(k+'-') && workData[x]).length;
  const stats = '<div class="card"><div class="card-title">'+t('st_title')+'<button class="btn-link" onclick="setTab(\'settings\')">'+t('st_change')+'</button></div>'+
    '<div class="stat"><span>'+t('st_days')+'</span><b class="num">'+daysWorked+'</b></div>'+
    '<div class="stat"><span>'+t('st_avg')+'</span><b class="num">'+(daysWorked ? hrsFmt(tot.h/daysWorked) : '—')+'</b></div>'+
    '<div class="stat"><span>'+t('st_rate')+'</span><b class="num">'+moneyExact(RATE)+'</b></div>'+
    '<div class="stat"><span>'+t('st_tax')+'</span><b class="num">'+taxPct()+'%</b></div></div>';

  return '<div class="page">'+
    '<div class="summary n'+(many ? 1 : pays.length)+'">'+hero+cards+'</div>'+
    '<div class="work-grid">'+calendar+'<div class="side">'+payList+goal+stats+'</div></div>'+
    '</div>';
}

function setWorkSetting(field,val){
  const k=mKey(Y,Mo);
  const cur = workSettings[k] || {};
  cur[field] = val===''? '' : Math.max(0, Number(val)||0);
  workSettings[k]=cur;

/* ══════════════ DAY EDITOR ══════════════ */
function openDay(n){

  dayDraft = {
    n, time: workData[k]||'',

function renderDaySheet(){
  const dd = dayDraft, k = mKey(Y,Mo);
  const perShift = Number((workSettings[k]||{}).hoursPerShift)||0;
  const seg = ['regular','holiday','short'].map(tp=>'<button class="'+(dd.type===tp?'on':'')+'" onclick="setDayType(\''+tp+'\')">'+t('type_'+tp)+'</button>').join('');
  const typeNote = dd.type==='short' ? '<div class="note">'+t('de_short_note')+'</div>'+

    : '';
  /* A day off has no shift, so there's no time or extra rate to enter. */

    ? '<div class="note">'+t('de_hol_note')+(dd.time || dd.extra ? ' <span class="warn">'+t('de_hol_drop')+'</span>' : '')+'</div>'
    : typeNote+'<div class="sep"></div>'+

      '<input id="dd-time" class="time-big" type="text" inputmode="numeric" placeholder="00:00:00" autocomplete="off" value="'+esc(dd.time)+'" oninput="onTimeInput(this)">'+
      '<div class="form-err" id="dd-err">'+esc(dd.err)+'</div>'+
      (perShift>0 ? '<div class="quick"><button class="chip" onclick="fillShift('+perShift+')">'+ICONS.clock+t('de_fill', hrsFmt(perShift))+'</button></div>' : '')+
      '<div class="sep"></div>'+
      '<div class="toggle-row"><div><div class="lbl">'+t('de_extra')+'</div><div class="note">'+t('de_extra_note')+'</div></div>'+
        '<button class="switch'+(dd.extra?' on':'')+'" role="switch" aria-checked="'+dd.extra+'" onclick="toggleExtra()"></button></div>'+
      (dd.extra ? '<div class="affix mt10"><input id="dd-rate" class="input num" type="number" min="0" placeholder="'+esc(t('de_rate_ph'))+'" value="'+esc(dd.rate)+'" oninput="dayDraft.rate=this.value"><em>'+perHour()+'</em></div>' : '');
  return '<div class="sheet" role="dialog" aria-modal="true">'+
    '<div class="sheet-head"><div><div class="sheet-title">'+longDate(new Date(Y,Mo,dd.n))+'</div>'+
      '<div class="sheet-sub num">'+t('de_usual', resolvedHoursForDay(Y,Mo,dd.n))+'</div></div>'+
      '<button class="icon-btn" onclick="closeModal()" title="'+esc(t('btn_close'))+'">'+ICONS.close+'</button></div>'+
    '<div class="sheet-body">'+
      '<div class="seg">'+seg+'</div>'+body+
    '</div>'+
    '<div class="sheet-foot"><button class="btn btn-secondary" onclick="closeModal()">'+t('btn_cancel')+'</button>'+
      '<button class="btn btn-primary" onclick="saveDay()">'+t('btn_save')+'</button></div>'+
    '</div>';
}
function setDayType(tp){
  dayDraft.type = tp; dayDraft.err = ''; renderModal();
  const el = document.getElementById(tp==='short' ? 'dd-short' : 'dd-time'); if (el) el.focus();
}
function toggleExtra(){
  dayDraft.extra = !dayDraft.extra; dayDraft.err = ''; renderModal();
  if (dayDraft.extra){ const el=document.getElementById('dd-rate'); if (el) el.focus(); }
}
function clearDayTime(){ dayDraft.time=''; dayDraft.err=''; renderModal(); const el=document.getElementById('dd-time'); if(el) el.focus(); }
function fillShift(h){
  const hh=Math.floor(h), mm=Math.round((h-hh)*60);
  dayDraft.time = String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')+':00';
  dayDraft.err=''; renderModal();
}
function onTimeInput(el){
  const digs = el.value.replace(/\D/g,'').slice(0,6);
  let f=digs;
  if (digs.length>4) f=digs.slice(0,2)+':'+digs.slice(2,4)+':'+digs.slice(4);
  else if (digs.length>2) f=digs.slice(0,2)+':'+digs.slice(2);
  el.value=f;
  dayDraft.time=f;
  const hadErr = !!dayDraft.err;
  dayDraft.err='';
  if (hadErr){ const e=document.getElementById('dd-err'); if(e) e.textContent=''; }
}
/* Accepts "4", "04", "04:30", "04:30:15"; returns hh:mm:ss, '' for empty, or null. */
function normalizeTime(s){
  const digs = String(s||'').replace(/\D/g,'');
  if (!digs) return '';
  if (digs.length<=2) return digs.padStart(2,'0')+':00:00';
  if (digs.length===4) return digs.slice(0,2)+':'+digs.slice(2,4)+':00';
  if (digs.length===6) return digs.slice(0,2)+':'+digs.slice(2,4)+':'+digs.slice(4,6);
  return null;
}
function dayError(msg){ dayDraft.err = msg; const e=document.getElementById('dd-err'); if (e) e.textContent = msg; }
function saveDay(){
  const dd = dayDraft, k = wKey(dd.n);
  if (dd.type==='holiday'){ dd.time=''; dd.extra=false; }
  const time = normalizeTime(dd.time);
  if (time===null) return dayError(t('err_format'));
  if (time){ const [,mm,ss]=time.split(':').map(Number); if (mm>=60||ss>=60) return dayError(t('err_minsec')); }
  const shortH = Number(dd.short), rate = Number(dd.rate);
  if (dd.type==='short' && !(shortH>0)) return dayError(t('err_short'));
  if (dd.extra && !(rate>0)) return dayError(t('err_rate'));

  const before = JSON.stringify([workData[k], holidayAdj[k], overtimeRate[k]]);
  if (time) workData[k]=time; else delete workData[k];
  if (dd.type==='holiday') holidayAdj[k]={type:'holiday'};
  else if (dd.type==='short') holidayAdj[k]={type:'shortened', hours:Math.abs(shortH)};
  else delete holidayAdj[k];
  if (dd.extra) overtimeRate[k]=rate; else delete overtimeRate[k];
  const after = [workData[k], holidayAdj[k], overtimeRate[k]];
  const prev = JSON.parse(before);
  if (prev[0]!==after[0]) save('workData');
  if (JSON.stringify(prev[1])!==JSON.stringify(after[1])) save('holidayAdj');
  if (prev[2]!==after[2]) save('overtimeRate');
  closeModal();
  render();
}

function askConfirm(opts){ confirmState = opts; renderModal(true); }

/* ══════════════ PLANNER ══════════════ */
function renderPlanner(){
  const k = mKey(Y,Mo), d = dim(Y,Mo), fw = firstWd(Y,Mo);
  const ws = workSettings[k] || {};
  const perShift = Number(ws.hoursPerShift)||0;
  const schedType = (ws.scheduleType==='custom' ? 'flex' : ws.scheduleType) || '5/2';
  const blocked = new Set(), short = {};
  for (let dd=1; dd<=d; dd++){
    const adj=holidayAdj[keyFor(Y,Mo,dd)];
    if (adj && adj.type==='holiday') blocked.add(dd);
    else if (adj) short[dd] = Number(adj.hours)||0;
  }
  const suggested = new Set(generateScheduleSuggestion(Y, Mo, ws.shifts, schedType, blocked, new Set(Object.keys(short).map(Number))));
  const plannedH = [...suggested].reduce((sum,n)=>sum+Math.max(0, perShift-(short[n]||0)), 0);

  const pats = [['5/2','5/2','pat_52'],['2/2','2/2','pat_22'],['7/0','7/0','pat_70'],['flex',t('flex'),'pat_flex']];
  const patterns = '<div class="patterns">'+pats.map(p=>'<button class="pattern'+(schedType===p[0]?' on':'')+'" onclick="setScheduleType(\''+p[0]+'\')"><b>'+p[1]+'</b><small>'+t(p[2])+'</small></button>').join('')+'</div>';

  let body;
  if (!ws.shifts){
    body = '<div class="empty-box"><p>'+t('pl_no_goal')+'</p><button class="btn btn-primary" onclick="setTab(\'work\')">'+t('pl_set_goal')+'</button></div>';
  } else {
    const cells = [...Array(fw).fill(null), ...Array.from({length:d},(_,i)=>i+1)];
    while (cells.length%7!==0) cells.push(null);
    const head = dayNames().map((n,i)=>'<div'+(i===6?' class="sun"':'')+'>'+n+'</div>').join('');
    const grid = cells.map((n,i)=>{
      if (!n) return '<div class="day empty"></div>';
      const hol = blocked.has(n);
      const cls = ['day', isTodayCell(n)?'today':'', suggested.has(n)&&!hol?'sug':'', hol?'hol':'', i%7===6?'sun':''].filter(Boolean).join(' ');
      const tip = hol ? t('tip_holiday') : resolvedHoursForDay(Y,Mo,n)+(n in short ? ' · '+t('tip_short', hrsFmt(short[n])) : '');
      return '<div class="'+cls+'" title="'+esc(tip)+'"><span class="n">'+n+'</span>'+(n in short?'<span class="sd"></span>':'')+(workData[wKey(n)]?'<span class="wd"></span>':'')+'</div>';
    }).join('');
    body = '<div class="pl-stats"><div><b class="num">'+suggested.size+'</b>'+t('f_shifts')+'</div>'+
      (perShift>0 ? '<div><b class="num">'+hrsFmt(plannedH)+'</b>'+t('pl_hours_total')+'</div>' : '')+'</div>'+
      '<div class="cal-head">'+head+'</div><div class="cal compact">'+grid+'</div>'+
      '<div class="pl-note"><span class="sw"></span><span>'+t('pl_note')+'</span></div>';
  }
  const left = '<div class="card"><div class="card-title">'+t('pl_pattern')+'</div>'+patterns+
    '<div class="card-title" style="margin-bottom:12px">'+t('pl_schedule')+'</div>'+body+'</div>';

  const hoursRow = (label, from, to) => '<div class="hours-row"><span>'+label+'</span>'+
    '<input class="input num" type="time" value="'+esc(scheduleHours[from])+'" oninput="setScheduleHour(\''+from+'\', this.value)">'+
    '<i>–</i><input class="input num" type="time" value="'+esc(scheduleHours[to])+'" oninput="setScheduleHour(\''+to+'\', this.value)"></div>';
  const hoursCard = '<div class="card"><div class="card-title">'+t('pl_hours')+'</div>'+
    hoursRow(t('weekdays'),'weekdayFrom','weekdayTo')+hoursRow(t('weekends'),'weekendFrom','weekendTo')+'</div>';

  let breaks;
  if (perShift>0){
    const rows = breakPlanRows(breakDay==='weekday' ? scheduleHours.weekdayFrom : scheduleHours.weekendFrom, perShift);
    breaks = '<div class="seg">'+
        '<button class="'+(breakDay==='weekday'?'on':'')+'" onclick="setBreakDay(\'weekday\')">'+t('weekdays')+'</button>'+
        '<button class="'+(breakDay==='weekend'?'on':'')+'" onclick="setBreakDay(\'weekend\')">'+t('weekends')+'</button></div>'+
      '<div class="bp">'+rows.map(r=>'<div class="bp-row'+(r.type==='break'?' brk':'')+'"><b class="num">'+r.from+' – '+r.to+'</b><span>'+
        (r.type==='break' ? t('break_w')+' · '+hrsFmt(r.mins/60) : t('work_w'))+'</span></div>').join('')+'</div>'+
      '<div class="note" style="margin-top:12px">'+t('breaks_note')+'</div>';
  } else breaks = '<div class="note" style="margin-top:0">'+t('pl_breaks_need')+'</div>';
  const breaksCard = '<div class="card"><div class="card-title">'+t('pl_breaks')+'</div>'+breaks+'</div>';

  return '<div class="page"><div class="pl-grid">'+left+'<div class="side">'+hoursCard+breaksCard+'</div></div></div>';
}

/* Per-period dropdowns: 'pend:<i>' (last day of the period), 'pday:<i>' (payday), 'pmon:<i>' (same/next month). */
function ddDef(id){
  if (DD[id]) return DD[id];
  const [kind, si] = id.split(':'), i = Number(si), p = PAY.periods[i], n = PAY.periods.length;
  const set = (f,v)=>{ p[f]=v; save('payDays'); render(); };
  if (kind==='pend'){
    const min = i ? PAY.periods[i-1].end+1 : 1, max = PAY_LAST_END-(n-2-i);
    return { value:()=>p.end, pick:v=>set('end',v),
      items:()=>Array.from({length:max-min+1},(_,k)=>({v:min+k, label:t('pp_until', min+k)})) };
  }
  if (kind==='pday') return { value:()=>p.day, pick:v=>set('day',v),
    items:()=>Array.from({length:31},(_,k)=>({v:k+1, label:String(k+1), sub:k===30?t('pp_last'):''})) };
  return { value:()=>p.month, pick:v=>set('month',v),
    items:()=>[{v:0, label:t('pm_same')}, {v:1, label:t('pm_next')}] };
}
function setPayMode(m){ if (PAY.mode===m) return; PAY.mode = m; save('payDays'); render(); }
/* Splits the month evenly into n payouts; each one can be adjusted after. */
function setPayCount(n){
  if (n<1 || n>31 || n===PAY.periods.length) return;
  PAY.periods = Array.from({length:n}, (_,i)=>{
    if (i===n-1) return payFor(PAY_LAST_END);
    const end = Math.floor(31*(i+1)/n);
    return Object.assign({end}, payFor(end));
  });
  save('payDays'); render();
}
/* Its days go to the next period (or the previous one, for the last). */
function delPeriod(i){
  const ps = PAY.periods;
  if (ps.length<2) return;
  ps.splice(i, 1);
  delete ps[ps.length-1].end;
  save('payDays'); render();
}
function setCycle(f, v){
  const c = PAY.cycle;
  if (f==='start'){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
    c.start = v; save('payDays'); render(); return;
  }
  const n = Number(v);
  if (v==='' || !Number.isInteger(n) || n<(f==='len' ? 1 : 0) || n>CYCLE_MAX) return;
  c[f] = n; saveLater('payDays', 500);
}
function setCycleLen(n){ PAY.cycle.len = n; save('payDays'); render(); }
function toggleShift(){ PAY.shift = !PAY.shift; save('payDays'); render(); }
function ddTrigger(id, inner, small){
  return '<button class="dd-btn'+(small?' sm':'')+'" data-dd="'+id+'" onclick="toggleDD(\''+id+'\', this)" aria-haspopup="listbox">'+inner+'<span class="chev">'+ICONS.updown+'</span></button>';
}
function toggleDD(id, el){
  if (ddOpen && ddOpen.id===id){ closeDD(); return; }
  const def = ddDef(id), items = def.items(), cur = def.value();
  mp = null;
  ddOpen = {id, items, idx: Math.max(0, items.findIndex(x=>x.v===cur)), anchor: el};
  const root = document.getElementById('popover-root');
  root.innerHTML = '<div class="pop" role="listbox" id="pop" style="visibility:hidden">'+items.map((it,i)=>
    '<button class="pop-item'+(it.v===cur?' sel':'')+(i===ddOpen.idx?' kb':'')+'" role="option" data-i="'+i+'" onmouseenter="ddHover('+i+')" onclick="ddPick('+i+')">'+
    '<span class="ck">'+ICONS.check+'</span>'+(it.icon||'')+'<span>'+esc(it.label)+'</span>'+(it.sub?'<span class="sub">'+esc(it.sub)+'</span>':'')+'</button>').join('')+'</div>';
  const pop = document.getElementById('pop'), r = el.getBoundingClientRect();
  pop.style.minWidth = Math.max(r.width, 240)+'px';
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = Math.min(r.right - w, window.innerWidth - w - 8); left = Math.max(8, left);
  let top = r.bottom + 6;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - 6 - h);
  pop.style.left = left+'px'; pop.style.top = top+'px'; pop.style.visibility = '';
  const selEl = pop.querySelector('.pop-item.kb'); if (selEl) selEl.scrollIntoView({block:'nearest'});
}
function ddHover(i){
  if (!ddOpen) return;
  ddOpen.idx = i;
  document.querySelectorAll('#pop .pop-item').forEach(b=>b.classList.toggle('kb', Number(b.dataset.i)===i));
}
function ddPick(i){
  if (!ddOpen) return;
  const def = ddDef(ddOpen.id), it = ddOpen.items[i];
  closeDD();
  if (it && it.v!==def.value()) def.pick(it.v);
}
function closeDD(){ if (!ddOpen && !mp) return; ddOpen=null; mp=null; document.getElementById('popover-root').innerHTML=''; }
document.addEventListener('mousedown', e=>{
  if ((ddOpen || mp) && !e.target.closest('.pop') && !e.target.closest('.dd-btn') && !e.target.closest('.title-btn')) closeDD();
});

function setPayRate(val){
  const v = Number(val);
  if (val==='' || !(v>0)) return;
  RATE = v; saveLater('payRate', 600);
}
function setTaxPct(val){
  const v = Number(val);
  if (val==='' || isNaN(v) || v<0 || v>=100) return;
  TAX = Math.round((1-v/100)*10000)/10000; saveLater('payTax', 600);
}

async function exportAllData(){
  if (!NATIVE) return;
  const all = { app:'salarium', version:APP_INFO.version, exportedAt:new Date().toISOString() };
  KEYS.forEach(k=>{ all[k]=PERSIST[k](); });
  const ok = await NATIVE.exportData(JSON.stringify(all, null, 2));
  if (ok) toast(t('toast_exported'));
}
async function importAllData(){
  if (!NATIVE) return;
  const str = await NATIVE.importData();
  if (!str) return;
  let all;
  try { all = JSON.parse(str); } catch(e){ all = null; }
  const keys = all && typeof all==='object' ? KEYS.filter(k=>k in all) : [];
  if (!keys.length || !(all.workData || all.workSettings)){ toast(t('toast_bad_file'), 'err'); return; }
  askConfirm({ title:t('imp_title'), body:t('imp_body'), ok:t('imp_ok'), danger:true, onOk: async ()=>{
    try {
      for (const k of keys) await sSet(k, all[k]);
      location.reload();
    } catch(e){ toast(t('toast_save_err'), 'err'); }
  }});
}

function renderSettings(){
  const lang = LANGS.find(l=>l.code===LANG) || LANGS[0];
  const row = (icon, color, label, sub, ctl) => '<div class="row">'+tile(icon,color)+
    '<div class="row-text"><div class="row-label">'+label+'</div>'+(sub?'<div class="row-sub">'+sub+'</div>':'')+'</div>'+
    '<div class="row-ctl">'+ctl+'</div></div>';
  const themeSeg = '<div class="seg">'+['system','light','dark'].map(th=>'<button class="'+(THEME===th?'on':'')+'" onclick="setTheme(\''+th+'\')">'+t('th_'+th)+'</button>').join('')+'</div>';
  const modeSeg = '<div class="seg">'+['dates','cycle'].map(m=>'<button class="'+(PAY.mode===m?'on':'')+'" onclick="setPayMode(\''+m+'\')">'+t('pm_'+m)+'</button>').join('')+'</div>';
  let payRows;
  if (PAY.mode==='dates'){
    const rows = dateRows(), n = rows.length;
    const stepper = '<div class="stepper"><button class="icon-btn" onclick="setPayCount('+(n-1)+')"'+(n<2?' disabled':'')+'>'+ICONS.minus+'</button>'+
      '<b class="num">'+n+'</b><button class="icon-btn" onclick="setPayCount('+(n+1)+')"'+(n>30?' disabled':'')+'>'+ICONS.plus+'</button></div>';
    payRows = row('cal','#5e5ce6', t('pp_count'), t('pp_count_note'), stepper)+rows.map(r=>{
      const range = n===1 ? t('pp_whole') : r.last ? t('pp_range_end', r.from) : t('pp_range', r.from, r.to);
      const early = !r.p.month && r.p.day<r.to;
      return row('cal', PAY_TILES[r.i%4], t('pp_for', range),
        t(r.p.month ? 'pp_on_next' : 'pp_on_same', r.p.day)+(early ? ' · <span class="warn">'+t('pp_early')+'</span>' : ''),
        '<div class="pay-ctl">'+(r.last ? '<span class="dd-btn sm dd-static">'+t('pp_until_end')+'</span>' : ddTrigger('pend:'+r.i, '<span class="num">'+t('pp_until', r.p.end)+'</span>', true))+
        ddTrigger('pday:'+r.i, '<span class="num">'+r.p.day+'</span>', true)+
        ddTrigger('pmon:'+r.i, '<span>'+t(r.p.month ? 'pm_next' : 'pm_same')+'</span>', true)+'</div>'+
        (n>1 ? '<button class="icon-btn" onclick="delPeriod('+r.i+')" title="'+esc(t('pp_del'))+'">'+ICONS.close+'</button>' : ''));
    }).join('');
  } else {
    const c = PAY.cycle;
    const quick = '<div class="seg">'+[[1,'cy_daily'],[7,'cy_weekly'],[14,'cy_biweekly']].map(([n,k])=>'<button class="'+(c.len===n?'on':'')+'" onclick="setCycleLen('+n+')">'+t(k)+'</button>').join('')+'</div>';
    const numIn = (f, min) => '<div class="affix"><input class="input num" type="number" min="'+min+'" max="'+CYCLE_MAX+'" step="1" value="'+c[f]+'" oninput="setCycle(\''+f+'\', this.value)"><em>'+t('d_unit')+'</em></div>';
    payRows = row('target','#5e5ce6', t('cy_quick'), '', quick)+
      row('clock','#0a84ff', t('cy_len'), t('cy_len_note'), numIn('len', 1))+
      row('cal','#34c759', t('cy_start'), t('cy_start_note'), '<input class="input date-in" type="date" value="'+c.start+'" onchange="setCycle(\'start\', this.value)">')+
      row('cash','#ff9500', t('cy_delay'), t('cy_delay_note'), numIn('delay', 0));
  }
  /* The next few payouts, so the schedule can be checked at a glance. */
  const today = new Date(), today0 = new Date(today.getFullYear(), today.getMonth(), today.getDate()), seen = {};
  const upcoming = [-1,0,1,2].flatMap(off=>{ const m = new Date(today.getFullYear(), today.getMonth()+off, 1); return payoutsFor(m.getFullYear(), m.getMonth()); })
    .filter(r=>r.pay>=today0 && !seen[r.from.getTime()] && (seen[r.from.getTime()] = 1))
    .sort((a,b)=>a.pay-b.pay).slice(0,4);
  const upRows = upcoming.map(r=>'<div class="row up-row"><span class="dot" style="background:'+PAY_COLORS[r.i%4]+'"></span><div class="row-text">'+periodLabel(r.from, r.to)+'</div>'+
    '<div class="row-ctl up-date num">'+cap(fmt('d:up',{weekday:'short',day:'numeric',month:'long'}).format(r.pay))+'</div></div>').join('');
  let host = SUPABASE_URL; try { host = new URL(SUPABASE_URL).host; } catch(e){}

  return '<div class="page narrow">'+
    '<div class="group-title">'+t('set_general')+'</div><div class="group">'+
      row('globe','#0a84ff', t('set_lang'), '', ddTrigger('lang', flagHtml(lang.flag)+'<span>'+lang.name+'</span>'))+
      row('theme','#5e5ce6', t('set_theme'), '', themeSeg)+
      row('cash','#30b350', t('set_currency'), '', ddTrigger('currency', '<span class="cur">'+esc(curSymbol())+'</span><span>'+esc(CUR)+'</span>'))+
    '</div>'+
    '<div class="group-title">'+t('set_pay')+'</div><div class="group">'+
      row('clock','#ff9500', t('set_rate'), t('set_rate_note'),
        '<div class="affix"><input class="input num" type="number" min="0" step="any" value="'+esc(RATE)+'" oninput="setPayRate(this.value)"><em>'+perHour()+'</em></div>')+
      row('percent','#ff3b30', t('set_tax'), t('set_tax_note'),
        '<div class="affix"><input class="input num" type="number" min="0" max="99" step="any" value="'+esc(taxPct())+'" oninput="setTaxPct(this.value)"><em>%</em></div>')+
      row('cal','#30b350', t('set_pmode'), t('set_pmode_note'), modeSeg)+
      row('cal','#ff9500', t('set_shift'), t('set_shift_note'),
        '<button class="switch'+(PAY.shift?' on':'')+'" role="switch" aria-checked="'+PAY.shift+'" onclick="toggleShift()"></button>')+
    '</div>'+
    '<div class="group-title">'+t('set_payouts')+'</div><div class="group">'+payRows+'</div>'+
    '<div class="group-title">'+t('set_upcoming')+'</div><div class="group">'+upRows+'</div>'+
    '<div class="group-title">'+t('set_backup')+'</div><div class="group">'+
      row('down','#34c759', t('set_export'), t('set_export_note'), '<button class="btn btn-secondary btn-sm" onclick="exportAllData()">'+t('btn_export')+'</button>')+
      row('up','#ff9f0a', t('set_import'), t('set_import_note'), '<button class="btn btn-secondary btn-sm" onclick="importAllData()">'+t('btn_import')+'</button>')+
    '</div>'+
    '<div class="group-title">'+t('set_db')+'</div><div class="group">'+
      row('db','#8e8e93', 'Supabase', t('set_db_note'), '<span class="db-host" title="'+esc(host)+'">'+esc(host)+'</span>')+
    '</div>'+
    '</div>';
}

/* ══════════════ ABOUT ══════════════ */
function renderAbout(){
  const f = (icon, color, key) => '<div class="card feature">'+tile(icon,color)+'<div><h3>'+t(key+'_t')+'</h3><p>'+t(key+'_b')+'</p></div></div>';
  return '<div class="page" style="max-width:760px">'+
    '<div class="about-hero"><div class="app-icon">'+logoSvg()+'</div><h1>Salarium</h1>'+
      (APP_INFO.version ? '<div class="ver">'+t('ab_version', esc(APP_INFO.version))+'</div>' : '')+
      '<p>'+t('ab_tagline')+'</p></div>'+
    '<div class="features">'+
      f('clock','#0a84ff','ab_log')+f('target','#34c759','ab_goal')+
      f('flag','#ff9500','ab_days')+f('cal','#af52de','ab_plan')+
      f('shield','#ff3b30','ab_past')+f('db','#8e8e93','ab_data')+
    '</div>'+
    '<div class="about-foot"><a href="https://github.com/drugdamage/salarium" target="_blank" rel="noopener">'+t('ab_source')+'</a><span>·</span><span>'+t('ab_license')+'</span></div>'+
    '</div>';
}

/* ══════════════ KEYBOARD ══════════════ */
document.addEventListener('keydown', e=>{
  if (mp){
    if (e.key==='Escape'){ e.preventDefault(); closeDD(); }
    return;
  }
  if (ddOpen){
    const n = ddOpen.items.length;
    if (e.key==='ArrowDown' || e.key==='ArrowUp'){
      e.preventDefault();
      ddHover((ddOpen.idx + (e.key==='ArrowDown'?1:n-1)) % n);
      const el = document.querySelector('#pop .pop-item.kb'); if (el) el.scrollIntoView({block:'nearest'});
    } else if (e.key==='Enter' || e.key===' '){ e.preventDefault(); ddPick(ddOpen.idx); }
    else if (e.key==='Escape' || e.key==='Tab'){ e.preventDefault(); closeDD(); }
    return;
  }
  if (dayDraft || confirmState){
    if (e.key==='Escape'){ e.preventDefault(); closeModal(); }
    else if (e.key==='Enter' && e.target.matches('input')){ e.preventDefault(); dayDraft ? saveDay() : confirmOk(); }
    return;
  }
  if (e.target.matches('input')){
    if (e.key==='Enter') e.target.blur();
    return;
  }
  if ((TAB==='work' || TAB==='planner') && LOAD==='ok' && !e.metaKey && !e.ctrlKey && !e.altKey){
    if (e.key==='ArrowLeft') prevMo();
    else if (e.key==='ArrowRight') nextMo();
  }
});

init();
</script>
