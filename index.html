<title>Salarium</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg:#151517;
  --rail-bg:#1c1c1e;
  --rail-active-bg:rgba(10,132,255,0.18);
  --card:#1e1e21;
  --surface:#1e1e21;
  --surface2:#2c2c2e;
  --text:#f5f5f7;
  --text2:#98989d;
  --text3:#6e6e73;
  --accent:#0a84ff;
  --accent-hover:#3d9bff;
  --red:#ff453a;
  --green:#30d158;
  --amber:#ff9f0a;
  --purple:#bf5af2;
  --border:rgba(255,255,255,0.09);
  --shadow:0 2px 20px rgba(0,0,0,0.4);
  --r-card:18px; --r:10px; --r-sm:8px;
}

html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;color:var(--text);}
*{scrollbar-width:thin;scrollbar-color:var(--surface2) transparent;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:var(--text3);}
body{overflow:hidden;}

.app-shell{display:flex;height:100vh;width:100vw;background:var(--bg);}
.rail{width:68px;flex-shrink:0;background:var(--rail-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:3px;overflow-y:auto;}
.rail-btn{width:54px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 7px;border-radius:12px;background:none;border:none;cursor:pointer;color:var(--text3);transition:background .12s,color .12s;font-family:inherit;flex-shrink:0;}
.rail-btn svg{width:20px;height:20px;}
.rail-btn span{font-size:8.5px;font-weight:500;letter-spacing:.1px;text-align:center;line-height:1.15;}
.rail-btn.active{background:var(--rail-active-bg);color:var(--accent);}
.rail-spacer{flex:1;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{padding:24px 24px 4px;font-size:26px;font-weight:700;letter-spacing:-0.4px;color:var(--text);flex-shrink:0;}
.content{flex:1;overflow-y:auto;padding:14px 24px 50px;}
.content-inner{max-width:480px;margin:0 auto;}

.month-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.month-title{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-0.1px;user-select:none;}
.nav-btn{background:none;border:none;cursor:pointer;color:var(--accent);font-size:20px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .1s;line-height:1;}
.nav-btn:hover{background:var(--surface2);}
.edit-link{display:block;text-align:center;background:none;border:none;cursor:pointer;color:var(--text2);font-size:12.5px;font-weight:500;font-family:inherit;padding:8px 0 2px;width:100%;letter-spacing:0.1px;transition:color .12s;}
.edit-link:hover{color:var(--accent);}
.edit-link.active{color:var(--accent);}

.day-labels{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.day-label{text-align:center;font-size:10.5px;font-weight:500;color:var(--text2);letter-spacing:0.3px;padding-bottom:6px;user-select:none;}
.day-label.sun{color:var(--red);}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--r);cursor:pointer;border:1.5px solid transparent;transition:background .1s;user-select:none;}
.cell:not(.empty):hover{background:var(--surface2);}
.cell.empty{cursor:default;pointer-events:none;}
.cell.today{background:var(--accent);}
.cell.today:hover{background:var(--accent-hover);}
.cell.selected:not(.today){border-color:var(--accent);background:rgba(10,132,255,0.18);}
.day-num{font-size:13px;font-weight:400;color:var(--text);line-height:1;}
.cell.today .day-num{color:#fff;font-weight:600;}
.cell.sun .day-num{color:var(--red);}
.cell.today.sun .day-num{color:#fff;}
.dot{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:3px;}
.cell.today .dot{background:rgba(255,255,255,0.8);}
.cell.day-off-marked{box-shadow:inset 0 0 0 1.5px var(--red);}
.cell.shortened-marked{box-shadow:inset 0 0 0 1.5px var(--amber);}
.cell.overtime-marked{box-shadow:inset 0 0 0 1.5px var(--purple);}
.cell.suggested-day{background:rgba(10,132,255,0.10);border:1.5px dashed var(--accent);}
.cell.today.suggested-day{background:var(--accent);border-color:transparent;}
.routine-cal.compact .cell{aspect-ratio:auto;height:26px;border-radius:6px;}
.routine-cal.compact .day-num{font-size:11px;}
.routine-cal.compact .day-label{font-size:9px;padding-bottom:3px;}
.routine-cal.compact .dot{width:3px;height:3px;margin-top:1px;}

.entry-panel{margin-top:14px;background:var(--surface2);border-radius:14px;border:1px solid var(--border);padding:14px 16px;animation:slideIn .15s ease;}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.entry-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.entry-date{font-size:14px;font-weight:600;color:var(--text);}
.icon-btn{background:none;border:none;cursor:pointer;padding:0;line-height:1;opacity:.8;transition:opacity .1s;color:var(--text2);font-family:inherit;}
.icon-btn:hover{opacity:1;}
.icon-btn.red{color:var(--red);font-size:20px;}

.time-input{width:100%;font-size:24px;font-weight:300;letter-spacing:5px;text-align:center;border:none;border-bottom:1.5px solid var(--border);outline:none;padding:4px 0 8px;color:var(--text);background:transparent;font-family:inherit;transition:border-color .15s;}
.time-input::placeholder{color:var(--text3);letter-spacing:3px;}
.time-input:focus{border-bottom-color:var(--accent);}
.entry-error{font-size:12px;color:var(--red);text-align:center;margin-top:6px;min-height:16px;}
.entry-btns{display:flex;gap:8px;margin-top:14px;}
.btn{flex:1;padding:10px 0;border-radius:var(--r);border:none;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .1s;}
.btn-cancel{background:var(--surface2);color:var(--text);}
.btn-cancel:hover{background:#3a3a3c;}
.btn-save{background:var(--accent);color:#fff;font-weight:600;}
.btn-save:hover{background:var(--accent-hover);}

.divider{height:1px;background:var(--border);margin:16px 0;}

.period-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:16px;}
.period-row{display:flex;justify-content:space-between;align-items:flex-start;}
.period-label{font-size:11px;color:var(--text2);font-weight:500;letter-spacing:0.2px;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.period-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block;}
.period-amount{font-size:21px;font-weight:600;color:var(--text);letter-spacing:-0.5px;}
.period-amount.zero{color:var(--text3);}
.period-meta{font-size:11px;color:var(--text2);margin-top:2px;}
.pay-badge{background:var(--surface2);border-radius:var(--r-sm);padding:4px 8px;text-align:center;flex-shrink:0;margin-left:10px;}
.pay-badge.urgent{background:rgba(255,159,10,0.16);}
.pay-badge-label{font-size:10px;color:var(--text2);}
.pay-badge.urgent .pay-badge-label{color:var(--amber);}
.pay-badge-value{font-size:12px;font-weight:600;color:var(--text);}
.pay-badge.urgent .pay-badge-value{color:var(--amber);}

.total-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.total-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.6px;}
.total-meta{font-size:11px;color:var(--text2);margin-top:2px;}
.total-amount{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-0.6px;text-align:right;}

.setting-row{display:flex;gap:10px;margin-bottom:10px;}
.setting-input{flex:1;min-width:0;background:var(--surface2);border:none;border-radius:8px;padding:9px 10px;color:var(--text);font-size:13px;font-family:inherit;outline:none;}
.setting-input::placeholder{color:var(--text3);}
.setting-input:disabled{opacity:.55;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;}

.group-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin:18px 4px 7px;}
.group-label:first-of-type{margin-top:0;}
.group-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;padding:0 14px;}

.add-note-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px 0;border-radius:var(--r);border:1.5px dashed var(--border);background:none;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:14px;transition:background .1s;}
.add-note-btn:hover{background:var(--surface);}
.empty-state{text-align:center;color:var(--text3);font-size:13px;padding:40px 0;}

.pill-row{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px;}
.pill{min-width:0;text-align:center;padding:8px 2px;border-radius:9px;background:var(--surface2);border:1.5px solid transparent;color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .1s,color .1s;white-space:normal;line-height:1.2;}
.pill.active{background:rgba(10,132,255,0.18);color:var(--accent);border-color:var(--accent);}
.legend-dash{display:inline-block;width:10px;height:10px;border-radius:3px;border:1.5px dashed var(--accent);background:rgba(10,132,255,0.10);vertical-align:-1px;margin-right:5px;}

.work-layout{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}
.work-main{flex:1 1 320px;min-width:280px;}
.work-side{flex:1 1 250px;min-width:230px;max-width:300px;}
.suggest-cal .cell{cursor:default;}

.lang-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.lang-btn{padding:12px 0;border-radius:var(--r);background:var(--surface2);border:1.5px solid transparent;color:var(--text2);font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .12s,color .12s;}
.lang-btn.active{background:rgba(10,132,255,0.18);color:var(--accent);border-color:var(--accent);}
</style>
</head>

<script>
/* Supabase credentials live in config.js (gitignored) — see config.example.js */
const CFG = window.SALARIUM_CONFIG || {};
const SUPABASE_URL = String(CFG.SUPABASE_URL || '').replace(/\/+$/, '');
const SUPABASE_KEY = String(CFG.SUPABASE_KEY || '');
const CONFIG_OK = /^https?:\/\/.+/.test(SUPABASE_URL) && SUPABASE_KEY.length > 0 &&
  !/YOUR-/.test(SUPABASE_URL + SUPABASE_KEY);

/* ══════════════ STORAGE ══════════════ */
const NET_TIMEOUT = 12000;
async function fetchTO(url, opts, ms){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), ms||NET_TIMEOUT);
  try { return await fetch(url, Object.assign({}, opts, {signal: ctrl.signal})); }
  finally { clearTimeout(t); }
}
/* Strict read: throws on network failure. Returns null ONLY when the request
   succeeded and the row genuinely does not exist. */
async function sGetStrict(k){
  let lastErr;
  for (let attempt=0; attempt<3; attempt++){
    try{
      const res = await fetchTO(SUPABASE_URL+'/rest/v1/kv_store?key=eq.'+encodeURIComponent(k)+'&select=value', {
        headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY }
      });
      if(!res.ok) throw new Error('HTTP '+res.status+' — '+k);
      const arr = await res.json();
      return (Array.isArray(arr) && arr[0]) ? arr[0].value : null;
    } catch(e){
      lastErr = e;
      if (attempt<2) await new Promise(r=>setTimeout(r, 700*(attempt+1)));
    }
  }
  throw lastErr || new Error('Read failed: '+k);
}
async function sGet(k){ try { return await sGetStrict(k); } catch(e){ return null; } }
async function sSet(k,v){
  try{
    await fetchTO(SUPABASE_URL+'/rest/v1/kv_store?on_conflict=key', {
      method:'POST',
      headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates' },
      body: JSON.stringify({ key:k, value:v })
    });
  } catch(e){}
}

function dim(y,m){ return new Date(y,m+1,0).getDate(); }
function firstWd(y,m){ const d=new Date(y,m,1).getDay(); return d===0?6:d-1; }
function parseTime(str){ if(!str) return 0; const [h=0,m=0,s=0]=str.split(':').map(Number); return h+m/60+s/3600; }
function rubFmt(n){ return Math.round(n).toLocaleString(LANG==='ru'?'ru-RU':'en-US')+' ₽'; }
function hrsFmt(h){

  if(!hh&&!mm) return '0 '+t('m_unit');
  return hh ? (hh+' '+t('h_unit')+(mm?' '+mm+' '+t('m_unit'):'')) : (mm+' '+t('m_unit'));
}
function daysTo(date){ const tt=new Date(), today=new Date(tt.getFullYear(),tt.getMonth(),tt.getDate()); return Math.round((date-today)/86400000); }
function shortDate(date){
  return LANG==='ru' ? (date.getDate()+' '+MONTHS_G(date.getMonth()))
                     : (date.getDate()+' '+MONTHS_G(date.getMonth()).slice(0,3));
}
function payLbl(diff,date){
  if(diff<0) return shortDate(date);
  if(diff===0) return t('pay_today');
  if(diff===1) return t('pay_tomorrow');
  if(diff<=30) return t('pay_in', diff);
  return shortDate(date);
}
function periodLabel(from,to){
  return LANG==='ru' ? (from+' – '+to+' '+MONTHS_G(Mo)) : (MONTHS_G(Mo)+' '+from+' – '+to);
}
function keyFor(y,mo,d){ return y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function wKey(d){ return keyFor(Y,Mo,d); }
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function holidayHourAdj(entry){
  if (!entry) return 0;
  if (entry.type==='shortened') return -(Number(entry.hours)||0);
  return 0; /* holiday: non-working marker, does not reduce the hours goal */
}
function calcPeriod(from,to){
  let h=0, gross=0;
  for(let d=from; d<=to; d++){
    const hrs=parseTime(workData[wKey(d)]);
    h+=hrs;
    const rate = overtimeRate[wKey(d)] ? Number(overtimeRate[wKey(d)]) : RATE;
    gross += hrs*rate;
  }
  return {h, gross, net:gross*TAX};
}
function computeHoursStatusFor(y,mo){
  const k = mKey(y,mo);
  const ws = workSettings[k] || {};
  const shifts=Number(ws.shifts)||0, perShift=Number(ws.hoursPerShift)||0;
  let target = shifts*perShift;
  const d = dim(y,mo);
  let actual=0;
  for(let dd=1; dd<=d; dd++){
    const dk=keyFor(y,mo,dd);
    actual += parseTime(workData[dk]);
    if (holidayAdj[dk]) target += holidayHourAdj(holidayAdj[dk]);
  }
  return {target, actual, remaining: target-actual};
}

/* ══════════════ SCHEDULE SUGGESTION ══════════════ */
function generateScheduleSuggestion(y, mo, shiftsTarget, patternType, blocked){
  blocked = blocked || new Set();
  const d = dim(y,mo);
  shiftsTarget = Math.min(Number(shiftsTarget)||0, d);
  if (shiftsTarget<=0) return [];
  if (patternType==='flex') return flexibleScheduleSuggestion(y, mo, shiftsTarget, blocked);
  if (patternType==='7/0'){
    const days=[]; let count=0;
    for(let dd=1; dd<=d && count<shiftsTarget; dd++){ if(blocked.has(dd)) continue; days.push(dd); count++; }
    return days;
  }
  const onLen = patternType==='2/2' ? 2 : 5;
  const offLen = patternType==='2/2' ? 2 : 2;
  const cycle = onLen+offLen;
  const buildForPhase = phase => {
    const days=[]; let count=0;
    for(let dd=1; dd<=d && count<shiftsTarget; dd++){
      if (blocked.has(dd)) continue;
      if (((dd-1+phase)%cycle) < onLen){ days.push(dd); count++; }
    }
    return days;
  };
  let best=null, bestScore=-1;
  for(let phase=0; phase<cycle; phase++){
    const days = buildForPhase(phase);
    if (days.length<shiftsTarget) continue;
    let score=0;
    for(let dd=1; dd<=d; dd++){
      const wd=new Date(y,mo,dd).getDay();
      if ((wd===0||wd===6) && !days.includes(dd)) score++;
    }
    if (score>bestScore){ bestScore=score; best=days; }
  }
  return best || buildForPhase(0);
}
function flexibleScheduleSuggestion(y, mo, shiftsTarget, blocked){
  const d = dim(y,mo);
  const available=[]; for(let dd=1; dd<=d; dd++) if(!blocked.has(dd)) available.push(dd);
  const n = Math.min(shiftsTarget, available.length);
  if (n<=0) return [];
  const isWeekend = dd => { const wd=new Date(y,mo,dd).getDay(); return wd===0||wd===6; };
  const used=new Set(), days=[];
  for(let i=0;i<n;i++){
    let idx = Math.max(0, Math.min(available.length-1, Math.round((i+0.5)*available.length/n)));
    let candidate = available[idx];
    if (isWeekend(candidate)){
      if (idx-1>=0 && !used.has(available[idx-1]) && !isWeekend(available[idx-1])) candidate=available[idx-1];
      else if (idx+1<available.length && !used.has(available[idx+1]) && !isWeekend(available[idx+1])) candidate=available[idx+1];
    }
    let guard=0;
    while(used.has(candidate) && guard<available.length){ idx=(idx+1)%available.length; candidate=available[idx]; guard++; }
    used.add(candidate); days.push(candidate);
  }
  return days.sort((a,b)=>a-b);
}

/* ══════════════ BREAK PLAN ══════════════ */
function buildBreakPlan(shiftHours){
  /* 5-minute break roughly every hour (OSHA micro-pauses) plus one 15-minute break
     near the middle of the shift (NIOSH; Duke Health for call-centre operators).
     Short shifts get a single break at the midpoint. */
  if (!shiftHours || shiftHours<=0) return [];
  const totalMin = shiftHours*60;
  if (totalMin <= 75){
    if (totalMin <= 30) return [{type:'work', hours:shiftHours}];
    const half = totalMin/2;
    return [
      {type:'work', hours:half/60},
      {type:'break', hours:5/60},
      {type:'work', hours:(totalMin-half)/60},
    ];
  }
  const blocks=[]; let remaining=totalMin, elapsed=0, midGiven=false;
  const midPoint = totalMin/2;
  while (remaining > 0.5){
    const work = Math.min(60, remaining);
    blocks.push({type:'work', hours:work/60});
    remaining -= work; elapsed += work;
    if (remaining > 0.5){
      const isMid = !midGiven && elapsed >= midPoint;
      if (isMid) midGiven = true;
      blocks.push({type:'break', hours:(isMid?15:5)/60});
    }
  }
  return blocks;
}
function fmtClock(mins){
  mins = ((Math.round(mins)%1440)+1440)%1440;
  const h=Math.floor(mins/60), m=mins%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function renderBreakPlan(startStr, shiftHours){
  if (!startStr || !shiftHours) return '';
  const [sh,sm] = startStr.split(':').map(Number);
  let cursor = sh*60+sm;
  return buildBreakPlan(shiftHours).map(b=>{
    const dur=b.hours*60;
    const part = fmtClock(cursor)+'–'+fmtClock(cursor+dur)+' '+(b.type==='work'?t('work_w'):t('break_w'));
    cursor += dur;
    return part;
  }).join(' · ');
}
function resolvedHoursForDay(y,mo,dd){
  const k=keyFor(y,mo,dd);
  if (dayHours[k] && (dayHours[k].from||dayHours[k].to)) return (dayHours[k].from||'—')+'–'+(dayHours[k].to||'—');
  const wd=new Date(y,mo,dd).getDay();
  return (wd===0||wd===6) ? scheduleHours.weekendFrom+'–'+scheduleHours.weekendTo : scheduleHours.weekdayFrom+'–'+scheduleHours.weekdayTo;
}

      '</div>'+
      '<div class="period-meta" style="margin-top:6px;">'+t('hint_holiday')+'</div>'+
      (showShortInput ? '<input class="setting-input" style="width:100%;margin-top:8px;" type="number" step="0.5" placeholder="'+t('ph_short')+'" value="'+(isShortened?curAdj.hours:'')+'" oninput="setShortenedHours(this.value)">' : '')+
      (curAdj ? '<button class="icon-btn" style="color:var(--text2);font-size:11px;margin-top:8px;" onclick="clearHolidayAdj()">'+t('clear_mark')+'</button>' : '')+
      '<button class="btn '+(otRate?'btn-save':'btn-cancel')+'" style="width:100%;margin-top:12px;" onclick="toggleOvertimeInput()">'+t('btn_overtime')+(otRate?' — '+otRate+' ₽/'+t('h_unit'):'')+'</button>'+
      '<div class="period-meta" style="margin-top:6px;">'+t('hint_overtime')+'</div>'+
      (showOtInput ? '<input class="setting-input" style="width:100%;margin-top:8px;" type="number" placeholder="'+t('ph_otrate')+'" value="'+(otRate||'')+'" oninput="setOvertimeRate(this.value)">' : '')+
      (otRate ? '<button class="icon-btn" style="color:var(--text2);font-size:11px;margin-top:6px;" onclick="clearOvertimeRate()">'+t('clear_otrate')+'</button>' : '')+
      '<div class="entry-btns"><button class="btn btn-cancel" onclick="closeEntry()">'+t('btn_cancel')+'</button><button class="btn btn-save" onclick="saveEntry()">'+t('btn_save')+'</button></div></div>';
  }

  const pCard = (label,p,payDate,diff,dot) => {
    const urgent = diff>=0 && diff<=3, hrs = p.h>0 ? hrsFmt(p.h) : null;
    return '<div class="period-card"><div class="period-row"><div>'+
      '<div class="period-label"><span class="period-dot" style="background:'+dot+'"></span>'+label+'</div>'+
      '<div class="period-amount'+(p.net===0?' zero':'')+'">'+rubFmt(p.net)+'</div>'+
      '<div class="period-meta">'+(hrs ? hrs+' &nbsp;·&nbsp; '+t('before_tax', rubFmt(p.gross)) : t('no_data'))+'</div></div>'+
      '<div class="pay-badge'+(urgent?' urgent':'')+'"><div class="pay-badge-label">'+t('pay_label')+'</div><div class="pay-badge-value">'+payLbl(diff,payDate)+'</div></div></div></div>';
  };

  const hs = computeHoursStatusFor(Y,Mo);
  const dis = canEdit ? '' : ' disabled';
  const goalStatus = hs.target>0
    ? t('goal_line', hrsFmt(hs.target), hrsFmt(hs.actual), (hs.remaining>=0 ? t('goal_left', hrsFmt(hs.remaining)) : t('goal_over', hrsFmt(hs.remaining))))
    : t('goal_empty');
  const goalCard = '<div class="period-card"><div class="period-label" style="margin-bottom:8px;">'+t('goal_title')+'</div>'+
    '<div class="setting-row"><input class="setting-input" type="number" placeholder="'+t('ph_shifts')+'" value="'+(ws.shifts||'')+'" oninput="setWorkSetting(\'shifts\', this.value)"'+dis+'>'+
    '<input class="setting-input" type="number" placeholder="'+t('ph_hours')+'" value="'+(ws.hoursPerShift||'')+'" oninput="setWorkSetting(\'hoursPerShift\', this.value)"'+dis+'></div>'+
    '<div class="setting-row" style="margin-top:8px;margin-bottom:0;"><input class="setting-input" type="number" placeholder="'+t('ph_rate')+'" value="'+RATE+'" oninput="setPayRate(this.value)"'+dis+'>'+
    '<input class="setting-input" type="number" step="0.01" placeholder="'+t('ph_tax')+'" value="'+TAX+'" oninput="setPayTax(this.value)"'+dis+'></div>'+
    '<div class="period-meta" style="margin-top:10px;">'+goalStatus+'</div>'+
    (hs.target>0 ? '<div class="period-meta" style="margin-top:5px;color:var(--green);font-weight:600;font-size:12px;">'+t('goal_net', rubFmt(hs.target*RATE*TAX))+'</div>' : '')+'</div>';

  const totHrs = tot.h>0 ? hrsFmt(tot.h) : null;
  const editLink = isPast ? '<button class="edit-link'+(canEdit?' active':'')+'" onclick="toggleWorkEdit(\''+wKeyStr+'\')">'+(canEdit?t('edit_done'):t('edit_month'))+'</button>' : '';
  const workMain = '<div class="month-header"><button class="nav-btn" onclick="prevMo()">&#8249;</button><span class="month-title">'+MONTHS(Mo)+' '+Y+'</span><button class="nav-btn" onclick="nextMo()">&#8250;</button></div>'+
    goalCard+'<div class="divider"></div>'+
    '<div class="day-labels">'+dayLabels+'</div><div class="cal-grid">'+grid+'</div>'+editLink+entry+'<div class="divider"></div>'+
    pCard(periodLabel(1,15), p1, pay1, df1, '#0a84ff')+pCard(periodLabel(16,d), p2, pay2, df2, '#30d158')+
    '<div class="total-card"><div><div class="total-label">'+t('month_total')+'</div><div class="total-meta">'+(totHrs?totHrs+' &nbsp;·&nbsp; '+t('before_tax', rubFmt(tot.gross)):t('no_data'))+'</div></div><div class="total-amount">'+rubFmt(tot.net)+'</div></div>';

  /* separate planner calendar — unrelated to logging actual hours */
  const schedLabels = {'5/2':'5/2','2/2':'2/2','7/0':'7/0','flex':t('sched_flex_low')};
  const pillBtn = (type,label) => '<button class="pill'+(schedType===type?' active':'')+'" onclick="setScheduleType(\''+type+'\')">'+label+'</button>';
  const sugDayLabels = DAY_NAMES().map((n,i)=>'<div class="day-label'+(i===6?' sun':'')+'">'+n.slice(0,1)+'</div>').join('');
  const sugGrid = cells.map((n,i)=>{
    if(!n) return '<div class="cell empty"></div>';
    const worked = !!workData[wKey(n)];
    const isHol = blockedDays.has(n);
    const cls=['cell', isToday(n)?'today':'', (suggested.has(n)&&!isHol)?'suggested-day':'', isHol?'day-off-marked':'', i%7===6?'sun':''].filter(Boolean).join(' ');
    const tip = isHol ? t('tip_holiday') : resolvedHoursForDay(Y,Mo,n);
    return '<div class="'+cls+'" title="'+tip+'"><span class="day-num">'+n+'</span>'+(worked?'<div class="dot"></div>':'')+'</div>';
  }).join('');
  const winRow = (label,fromField,toField) => '<div style="font-size:12px;color:var(--text2);margin-bottom:5px;">'+label+'</div>'+
    '<div class="setting-row" style="margin-bottom:10px;">'+
    '<input class="setting-input" type="time" value="'+scheduleHours[fromField]+'" oninput="setScheduleHour(\''+fromField+'\', this.value)">'+
    '<input class="setting-input" type="time" value="'+scheduleHours[toField]+'" oninput="setScheduleHour(\''+toField+'\', this.value)">'+
    '</div>';
  const weekdayPlan = renderBreakPlan(scheduleHours.weekdayFrom, perShift);
  const weekendPlan = renderBreakPlan(scheduleHours.weekendFrom, perShift);
  const workSide = '<div class="period-card">'+
    '<div class="period-label" style="margin-bottom:8px;">'+t('sched_title')+'</div>'+
    '<div class="pill-row">'+pillBtn('5/2','5/2')+pillBtn('2/2','2/2')+pillBtn('7/0','7/0')+pillBtn('flex',t('sched_flex'))+'</div>'+
    '<div class="period-label" style="margin:14px 0 8px;">'+t('work_time')+'</div>'+
    winRow(t('weekdays'),'weekdayFrom','weekdayTo')+winRow(t('weekends'),'weekendFrom','weekendTo')+
    '<div class="month-title" style="margin:10px 0 8px;font-size:13px;color:var(--text2);">'+MONTHS(Mo)+'</div>'+
    '<div class="routine-cal compact suggest-cal"><div class="day-labels">'+sugDayLabels+'</div><div class="cal-grid">'+sugGrid+'</div></div>'+
    '<div class="period-meta" style="margin-top:10px;">'+(ws.shifts ?
      '<span class="legend-dash"></span>'+t('sched_legend', schedLabels[schedType], MONTHS_G(Mo))
      : t('sched_empty'))+'</div>'+
    (perShift>0 ? '<div class="period-label" style="margin:14px 0 6px;">'+t('breaks_title')+'</div>'+
      '<div class="period-meta" style="margin-bottom:6px;"><b style="color:var(--text);">'+t('breaks_weekday')+'</b> '+(weekdayPlan||t('breaks_need_weekday'))+'</div>'+
      '<div class="period-meta"><b style="color:var(--text);">'+t('breaks_weekend')+'</b> '+(weekendPlan||t('breaks_need_weekend'))+'</div>'+
      '<div class="period-meta" style="margin-top:6px;color:var(--text3);">'+t('breaks_note')+'</div>'
      : '')+
    '</div>';

  return '<div class="work-layout"><div class="work-main">'+workMain+'</div><div class="work-side">'+workSide+'</div></div>';
}

/* ══════════════ WORK ACTIONS ══════════════ */
function setPayRate(val){
  clearTimeout(saveTimer);
  if (val==='') return;
  const v=Number(val); if(isNaN(v)) return;
  saveTimer=setTimeout(()=>{ RATE=v; sSet('payRate', RATE); },600);
}
function setPayTax(val){
  clearTimeout(saveTimer);
  if (val==='') return;
  const v=Number(val); if(isNaN(v)) return;
  saveTimer=setTimeout(()=>{ TAX=v; sSet('payTax', TAX); },600);
}
function markHoliday(){
  holidayAdj[wKey(sel)] = {type:'holiday'};
  holidayInputMode=null;
  sSet('holidayAdj', holidayAdj); render();
}
function toggleShortenedInput(){ holidayInputMode = holidayInputMode==='shortened' ? null : 'shortened'; render(); }
function setShortenedHours(val){
  const k=wKey(sel);
  clearTimeout(saveTimer);
  if (val==='') return;
  const v=Number(val); if(isNaN(v)) return;
  saveTimer=setTimeout(()=>{ holidayAdj[k]={type:'shortened', hours:Math.abs(v)}; sSet('holidayAdj', holidayAdj); },500);
}
function clearHolidayAdj(){ delete holidayAdj[wKey(sel)]; holidayInputMode=null; sSet('holidayAdj', holidayAdj); render(); }
function setScheduleHour(field,val){
  scheduleHours[field]=val;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>sSet('scheduleHours', scheduleHours),400);
}
function setWorkSetting(field,val){
  const k=mKey(Y,Mo);
  const cur = workSettings[k] || {};
  cur[field] = val===''? '' : Number(val);
  workSettings[k]=cur;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ sSet('workSettings', workSettings); }, 500);
}
function setScheduleType(type){
  const k=mKey(Y,Mo);
  const cur = workSettings[k] || {};
  cur.scheduleType = type;
  workSettings[k]=cur;
  sSet('workSettings', workSettings); render();
}
function prevMo(){ if(Mo===0){Y--;Mo=11;} else Mo--; sel=null; holidayInputMode=null; overtimeInputMode=false; render(); }
function nextMo(){ if(Mo===11){Y++;Mo=0;} else Mo++; sel=null; holidayInputMode=null; overtimeInputMode=false; render(); }
function clickDay(n){ sel=(sel===n)?null:n; holidayInputMode=null; overtimeInputMode=false; justOpenedEntry = sel!==null; render(); }
function closeEntry(){ sel=null; holidayInputMode=null; overtimeInputMode=false; render(); }
function onTimeInput(el){
  const digs = el.value.replace(/\D/g,'').slice(0,6);
  let f=digs;
  if (digs.length>4) f=digs.slice(0,2)+':'+digs.slice(2,4)+':'+digs.slice(4);
  else if (digs.length>2) f=digs.slice(0,2)+':'+digs.slice(2);
  el.value=f;
  const err=document.getElementById('err'); if(err) err.textContent='';
}
function onTimeKey(e){ if(e.key==='Enter') saveEntry(); if(e.key==='Escape') closeEntry(); }
function showErr(msg){ const el=document.getElementById('err'); if(el) el.textContent=msg; }
function saveEntry(){
  const ti=document.getElementById('ti'); const val= ti? ti.value.trim():'';
  if (val){
    if (!/^\d{2}:\d{2}:\d{2}$/.test(val)){ showErr(t('err_format')); return; }
    const [,mm,ss]=val.split(':').map(Number);
    if (mm>=60||ss>=60){ showErr(t('err_minsec')); return; }
    workData[wKey(sel)]=val;
  } else { delete workData[wKey(sel)]; }
  sSet('workData', workData); sel=null; holidayInputMode=null; overtimeInputMode=false; render();
}
function deleteDay(){ delete workData[wKey(sel)]; sSet('workData', workData); sel=null; holidayInputMode=null; overtimeInputMode=false; render(); }
function toggleOvertimeInput(){ overtimeInputMode=!overtimeInputMode; render(); }
function setOvertimeRate(val){
  if (val==='') return;
  const v=Number(val); if(isNaN(v)||v<=0) return;
  const k=wKey(sel);
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ overtimeRate[k]=v; sSet('overtimeRate', overtimeRate); },500);
}
function clearOvertimeRate(){ delete overtimeRate[wKey(sel)]; overtimeInputMode=false; sSet('overtimeRate', overtimeRate); render(); }

/* ══════════════ SETTINGS ══════════════ */
async function exportAllData(){
  if (!window.nativeFile) return;
  const all = { workData, workSettings, holidayAdj, overtimeRate, scheduleHours, dayHours, payRate:RATE, payTax:TAX, lang:LANG };
  await window.nativeFile.exportData(JSON.stringify(all, null, 2));
}
async function importAllData(){
  if (!window.nativeFile) return;
  const str = await window.nativeFile.importData();
  if (!str) return;
  try {
    const all = JSON.parse(str);
    for (const k of Object.keys(all)) await sSet(k, all[k]);
    location.reload();
  } catch(e){}
}
function renderSettings(){
  return '<div class="group-label">'+t('set_lang')+'</div>'+
    '<div class="lang-row">'+
    '<button class="lang-btn'+(LANG==='ru'?' active':'')+'" onclick="setLang(\'ru\')">Русский</button>'+
    '<button class="lang-btn'+(LANG==='en'?' active':'')+'" onclick="setLang(\'en\')">English</button>'+
    '</div>'+
    '<div class="group-label">'+t('set_backup')+'</div>'+
    '<div class="period-meta" style="margin:0 4px 12px;">'+t('set_backup_note')+'</div>'+
    '<div style="display:flex;gap:8px;">'+
    '<button class="add-note-btn" style="margin:0;flex:1;" onclick="exportAllData()">'+t('set_export')+'</button>'+
    '<button class="add-note-btn" style="margin:0;flex:1;" onclick="importAllData()">'+t('set_import')+'</button>'+
    '</div>';
}

/* ══════════════ ABOUT ══════════════ */
function renderAbout(){
  const sec = (title, body) => '<div class="group-label">'+title+'</div><div class="period-meta" style="margin:0 4px 16px;line-height:1.55;font-size:12.5px;">'+body+'</div>';
  return sec(t('about_work_t'), t('about_work_b'))+
    sec(t('about_hist_t'), t('about_hist_b'))+
    sec(t('about_set_t'), t('about_set_b'))+
    sec(t('about_data_t'), t('about_data_b'));
}

init();
</script>
</body>
</html>
